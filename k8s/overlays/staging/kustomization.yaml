apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tradegateway-staging

resources:
  - ../../base

images:
  - name: tradegateway/ngswtp
    newTag: "staging"

replicas:
  - name: tradegateway-app
    count: 2

patches:
  - target:
      kind: Deployment
      name: tradegateway-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  - target:
      kind: HorizontalPodAutoscaler
      name: tradegateway-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5

  - target:
      kind: Ingress
      name: tradegateway-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.tradegateway.gov.ng
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.tradegateway.gov.ng
      - op: replace
        path: /spec/tls/0/secretName
        value: tradegateway-staging-tls

configMapGenerator:
  - name: tradegateway-staging-config
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
      - DEMO_MODE=true
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=200
      - CORS_ORIGINS=https://staging.tradegateway.gov.ng
