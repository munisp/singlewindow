apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tradegateway-dev

resources:
  - ../../base

images:
  - name: tradegateway/ngswtp
    newTag: "dev"

replicas:
  - name: tradegateway-app
    count: 1

patches:
  - target:
      kind: Deployment
      name: tradegateway-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind: HorizontalPodAutoscaler
      name: tradegateway-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  - target:
      kind: Ingress
      name: tradegateway-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.tradegateway.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.tradegateway.local
      - op: replace
        path: /spec/tls/0/secretName
        value: tradegateway-dev-tls

configMapGenerator:
  - name: tradegateway-dev-config
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DEMO_MODE=true
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - CORS_ORIGINS=http://localhost:3000,http://dev.tradegateway.local
