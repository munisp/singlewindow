# NOTE: In production, use Sealed Secrets or External Secrets Operator
# These are placeholder values — replace before deploying
apiVersion: v1
kind: Secret
metadata:
  name: tradegateway-secrets
  namespace: tradegateway
type: Opaque
stringData:
  database-url: "postgresql://tradegateway:CHANGE_ME@postgres:5432/tradegateway"
  redis-url: "redis://:CHANGE_ME@redis:6379"
  jwt-secret: "CHANGE_ME_min_32_chars_random_secret_for_production"
  forge-api-key: "CHANGE_ME"
  frontend-forge-api-key: "CHANGE_ME"
  aws-access-key-id: "CHANGE_ME"
  aws-secret-access-key: "CHANGE_ME"
