name: tradegateway
description: TradeGateway™ NGSWTP — Flutter Mobile App
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Authentication & Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_appauth: ^8.0.1

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  data_table_2: ^2.5.14
  dropdown_search: ^5.0.6
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1

  # Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Maps
  google_maps_flutter: ^2.9.0

  # Storage & Persistence
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Utilities
  intl: ^0.19.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  open_file: ^3.5.8
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  retrofit_generator: ^9.1.3
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
