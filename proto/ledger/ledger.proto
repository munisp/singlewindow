syntax = "proto3";
package ledger;
option go_package = "tradegateway/proto/ledger";

import "google/protobuf/timestamp.proto";
import "common/common.proto";

// ─── TIGERBEETLE LEDGER BRIDGE (Rust gRPC service) ───────────────────────────

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  TRADER_LIABILITY   = 1;  // what trader owes
  DUTY_REVENUE       = 2;  // collected duties
  VAT_REVENUE        = 3;  // collected VAT
  BOND_ACCOUNT       = 4;  // customs bond
  PENALTY_ACCOUNT    = 5;  // fines
  DRAWBACK_ACCOUNT   = 6;  // duty drawback refunds
  SUSPENSE           = 7;  // pending settlement
}

enum TransferType {
  TRANSFER_TYPE_UNSPECIFIED = 0;
  DUTY_ASSESSMENT    = 1;
  DUTY_PAYMENT       = 2;
  VAT_PAYMENT        = 3;
  BOND_DEPOSIT       = 4;
  BOND_RELEASE       = 5;
  PENALTY_LEVY       = 6;
  DUTY_DRAWBACK      = 7;
  REFUND             = 8;
}

message Account {
  uint64      id           = 1;
  AccountType type         = 2;
  int64       trader_id    = 3;
  string      currency     = 4;
  uint64      debits_posted  = 5;
  uint64      credits_posted = 6;
  uint64      balance        = 7;  // credits - debits (in minor units)
  google.protobuf.Timestamp created_at = 8;
}

message CreateAccountRequest {
  AccountType type      = 1;
  int64       trader_id = 2;
  string      currency  = 3;
}

message TransferRequest {
  uint64       debit_account_id  = 1;
  uint64       credit_account_id = 2;
  uint64       amount            = 3;  // minor units (cents)
  string       currency          = 4;
  TransferType transfer_type     = 5;
  int64        declaration_id    = 6;
  string       reference         = 7;
  string       idempotency_key   = 8;
}

message TransferResponse {
  uint64 transfer_id = 1;
  bool   success     = 2;
  string error       = 3;
}

message GetAccountRequest {
  uint64 account_id = 1;
}

message GetBalanceRequest {
  int64  trader_id = 1;
  string currency  = 2;
}

message BalanceResponse {
  int64  trader_id       = 1;
  uint64 liability_balance = 2;
  uint64 bond_balance      = 3;
  string currency          = 4;
}

message TransferHistoryRequest {
  int64  declaration_id = 1;
  int64  trader_id      = 2;
  int32  limit          = 3;
}

message Transfer {
  uint64       id               = 1;
  uint64       debit_account_id  = 2;
  uint64       credit_account_id = 3;
  uint64       amount            = 4;
  string       currency          = 5;
  TransferType transfer_type     = 6;
  int64        declaration_id    = 7;
  string       reference         = 8;
  google.protobuf.Timestamp timestamp = 9;
}

message TransferHistoryResponse {
  repeated Transfer transfers = 1;
}

service LedgerService {
  rpc CreateAccount      (CreateAccountRequest)    returns (Account);
  rpc GetAccount         (GetAccountRequest)       returns (Account);
  rpc GetBalance         (GetBalanceRequest)       returns (BalanceResponse);
  rpc Transfer           (TransferRequest)         returns (TransferResponse);
  rpc GetTransferHistory (TransferHistoryRequest)  returns (TransferHistoryResponse);
  rpc Health             (common.PageRequest)      returns (common.HealthResponse);
}
