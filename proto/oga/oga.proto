syntax = "proto3";
package oga;
option go_package = "tradegateway/proto/oga";

import "google/protobuf/timestamp.proto";
import "common/common.proto";

// ─── OGA SERVICE (Go gRPC service) ───────────────────────────────────────────

enum PermitStatus {
  PERMIT_STATUS_UNSPECIFIED = 0;
  PENDING   = 1;
  APPROVED  = 2;
  REJECTED  = 3;
  EXPIRED   = 4;
  REVOKED   = 5;
}

enum OGAType {
  OGA_TYPE_UNSPECIFIED = 0;
  HEALTH_AUTHORITY     = 1;
  AGRICULTURE          = 2;
  ENVIRONMENT          = 3;
  STANDARDS_BUREAU     = 4;
  CENTRAL_BANK         = 5;
  DRUG_AUTHORITY       = 6;
  RADIATION_AUTHORITY  = 7;
  WILDLIFE_AUTHORITY   = 8;
  ENERGY_AUTHORITY     = 9;
  DEFENSE_MINISTRY     = 10;
}

message OGAPermit {
  int64        id              = 1;
  int64        declaration_id  = 2;
  string       permit_number   = 3;
  OGAType      oga_type        = 4;
  string       oga_name        = 5;
  PermitStatus status          = 6;
  int64        assigned_officer_id = 7;
  string       review_notes    = 8;
  string       conditions      = 9;
  google.protobuf.Timestamp requested_at = 10;
  google.protobuf.Timestamp reviewed_at  = 11;
  google.protobuf.Timestamp expires_at   = 12;
}

message RequestPermitRequest {
  int64   declaration_id = 1;
  OGAType oga_type       = 2;
  string  oga_name       = 3;
  string  notes          = 4;
}

message ReviewPermitRequest {
  int64        permit_id   = 1;
  PermitStatus status      = 2;
  string       notes       = 3;
  string       conditions  = 4;
  int64        officer_id  = 5;
}

message GetPermitsRequest {
  int64   declaration_id = 1;
  int64   officer_id     = 2;  // 0 = all
  PermitStatus status    = 3;  // 0 = all
}

message GetPermitsResponse {
  repeated OGAPermit permits = 1;
}

message JointInspectionStatus {
  int64  declaration_id    = 1;
  int32  total_agencies    = 2;
  int32  approved          = 3;
  int32  rejected          = 4;
  int32  pending           = 5;
  bool   all_cleared       = 6;
  bool   any_rejected      = 7;
}

service OGAService {
  rpc RequestPermit         (RequestPermitRequest)  returns (OGAPermit);
  rpc ReviewPermit          (ReviewPermitRequest)   returns (OGAPermit);
  rpc GetPermits            (GetPermitsRequest)     returns (GetPermitsResponse);
  rpc GetJointInspectionStatus (GetPermitsRequest)  returns (JointInspectionStatus);
  rpc Health                (common.PageRequest)    returns (common.HealthResponse);
}
