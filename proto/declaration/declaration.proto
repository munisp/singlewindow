syntax = "proto3";
package declaration;
option go_package = "tradegateway/proto/declaration";

import "google/protobuf/timestamp.proto";
import "common/common.proto";

// ─── ENUMS ───────────────────────────────────────────────────────────────────
enum DeclarationType {
  DECLARATION_TYPE_UNSPECIFIED = 0;
  IMPORT   = 1;
  EXPORT   = 2;
  TRANSIT  = 3;
  REEXPORT = 4;
  BONDED   = 5;
}

enum DeclarationStatus {
  DECLARATION_STATUS_UNSPECIFIED = 0;
  DRAFT               = 1;
  SUBMITTED           = 2;
  UNDER_ASSESSMENT    = 3;
  DOCS_REQUIRED       = 4;
  PAYMENT_PENDING     = 5;
  PAYMENT_CONFIRMED   = 6;
  UNDER_EXAMINATION   = 7;
  EXAMINATION_DONE    = 8;
  CLEARED             = 9;
  REJECTED            = 10;
  SUSPENDED           = 11;
}

enum RiskLane {
  RISK_LANE_UNSPECIFIED = 0;
  GREEN  = 1;  // auto-clear
  YELLOW = 2;  // doc review
  RED    = 3;  // physical inspection
  BLUE   = 4;  // AEO fast-track
}

// ─── MESSAGES ────────────────────────────────────────────────────────────────
message Declaration {
  int64             id                   = 1;
  string            declaration_number   = 2;
  string            ucr                  = 3;
  int64             trader_id            = 4;
  DeclarationType   declaration_type     = 5;
  DeclarationStatus status               = 6;
  string            hs_code              = 7;
  string            goods_description    = 8;
  string            country_of_origin    = 9;
  string            country_of_dest      = 10;
  string            port_of_entry        = 11;
  string            gross_weight         = 12;
  string            net_weight           = 13;
  int32             number_of_packages   = 14;
  common.Money      invoice_value        = 15;
  string            risk_score           = 16;
  RiskLane          risk_lane            = 17;
  common.Money      duty_amount          = 18;
  common.Money      vat_amount           = 19;
  common.Money      total_due            = 20;
  string            ai_explanation       = 21;  // JSON
  google.protobuf.Timestamp submitted_at = 22;
  google.protobuf.Timestamp cleared_at   = 23;
  google.protobuf.Timestamp created_at   = 24;
  google.protobuf.Timestamp updated_at   = 25;
}

message Document {
  int64  id             = 1;
  int64  declaration_id = 2;
  string document_type  = 3;
  string file_name      = 4;
  string file_url       = 5;
  string file_key       = 6;
  string mime_type      = 7;
  int64  file_size      = 8;
  bool   verified       = 9;
  google.protobuf.Timestamp uploaded_at = 10;
}

// ─── REQUESTS / RESPONSES ────────────────────────────────────────────────────
message CreateDeclarationRequest {
  int64           trader_id          = 1;
  DeclarationType declaration_type   = 2;
  string          hs_code            = 3;
  string          goods_description  = 4;
  string          country_of_origin  = 5;
  string          country_of_dest    = 6;
  string          port_of_entry      = 7;
  string          gross_weight       = 8;
  string          net_weight         = 9;
  int32           number_of_packages = 10;
  common.Money    invoice_value      = 11;
}

message GetDeclarationRequest {
  int64 id = 1;
}

message ListDeclarationsRequest {
  int64             trader_id = 1;  // 0 = all (admin)
  DeclarationStatus status    = 2;  // 0 = all
  common.PageRequest page     = 3;
}

message ListDeclarationsResponse {
  repeated Declaration declarations = 1;
  common.PageMeta      meta         = 2;
}

message SubmitDeclarationRequest {
  int64 id = 1;
}

message UpdateStatusRequest {
  int64             id     = 1;
  DeclarationStatus status = 2;
  string            notes  = 3;
  int64             actor_id = 4;
}

message AttachDocumentRequest {
  int64  declaration_id = 1;
  string document_type  = 2;
  string file_name      = 3;
  string file_url       = 4;
  string file_key       = 5;
  string mime_type      = 6;
  int64  file_size      = 7;
}

message GetDocumentsRequest {
  int64 declaration_id = 1;
}

message GetDocumentsResponse {
  repeated Document documents = 1;
}

message DeclarationStatsResponse {
  int64 total             = 1;
  int64 draft             = 2;
  int64 under_assessment  = 3;
  int64 payment_pending   = 4;
  int64 cleared           = 5;
  int64 rejected          = 6;
  int64 green_lane        = 7;
  int64 yellow_lane       = 8;
  int64 red_lane          = 9;
  int64 blue_lane         = 10;
}

// ─── SERVICE ─────────────────────────────────────────────────────────────────
service DeclarationService {
  rpc CreateDeclaration  (CreateDeclarationRequest)  returns (Declaration);
  rpc GetDeclaration     (GetDeclarationRequest)     returns (Declaration);
  rpc ListDeclarations   (ListDeclarationsRequest)   returns (ListDeclarationsResponse);
  rpc SubmitDeclaration  (SubmitDeclarationRequest)  returns (Declaration);
  rpc UpdateStatus       (UpdateStatusRequest)       returns (Declaration);
  rpc AttachDocument     (AttachDocumentRequest)     returns (Document);
  rpc GetDocuments       (GetDocumentsRequest)       returns (GetDocumentsResponse);
  rpc GetStats           (common.PageRequest)        returns (DeclarationStatsResponse);
  rpc Health             (common.PageRequest)        returns (common.HealthResponse);
}
