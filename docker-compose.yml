# ─── TradeGateway™ NGSWTP — Docker Compose (Full Stack) ─────────────────────
# Starts the complete platform including all backing services.
#
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Services only: docker compose up postgres redis
#
# Default credentials (override via .env file in production):
#   PostgreSQL: tradegateway / tradegateway_secure_2026 / db: tradegateway
#   Redis:      password: tradegateway_redis_2026
#   Temporal:   no auth (dev mode)
#
version: "3.9"

# ─── Shared networks ─────────────────────────────────────────────────────────
networks:
  tradegateway-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ─── Persistent volumes ──────────────────────────────────────────────────────
volumes:
  tigerbeetle_data:
  postgres_data:
  redis_data:
  temporal_data:
  prometheus_data:
  grafana_data:
  opensearch_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradegateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradegateway_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tradegateway}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-startup.sh:/docker-entrypoint-initdb.d/00-startup.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradegateway} -d ${POSTGRES_DB:-tradegateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tg-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-tradegateway_redis_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tradegateway_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── TradeGateway Application ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tg-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-tradegateway_jwt_secret_change_in_production_min_32_chars}
      VITE_APP_ID: ${VITE_APP_ID:-tradegateway-ngswtp}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-https://auth.manus.im}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-https://auth.manus.im/login}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-owner}
      OWNER_NAME: ${OWNER_NAME:-TradeGateway Admin}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-https://api.manus.im}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-https://api.manus.im}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-tradegateway}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal}
      TEMPORAL_PORT: ${TEMPORAL_PORT:-7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-tradegateway}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: tg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO bucket initializer ─────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: tg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing myminio/${S3_BUCKET:-tradegateway};
      mc anonymous set public myminio/${S3_BUCKET:-tradegateway};
      echo 'MinIO bucket initialized';
      "
    networks:
      - tradegateway-net

  # ── Temporal (Workflow Engine) ───────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:latest
    container_name: tg-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-tradegateway}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-tradegateway_secure_2026}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    volumes:
      - temporal_data:/etc/temporal/config
    ports:
      - "7233:7233"
      - "8233:8233"
    networks:
      - tradegateway-net

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: tg-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - tradegateway-net

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: tg-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-tradegateway_grafana_2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    networks:
      - tradegateway-net

  # ── OpenSearch (Log Analytics) ───────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: tg-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-TradeGateway@2026!}
      DISABLE_SECURITY_PLUGIN: "false"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - tradegateway-net
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_PASSWORD:-TradeGateway@2026!} https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tg-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - tradegateway-net

  # ── Microservices ─────────────────────────────────────────────────────────────
  # All 15 microservices are built from source in microservices/<name>/
  # They communicate with the main app via HTTP REST and gRPC.
  #
  # ⚠ PORT REGISTRY: this list is NOT the source of truth. The canonical
  # gateway-side registry is PORTS in server/_core/env.ts (SW-MP8), and the
  # gateway REFUSES TO BOOT when two resolved service URLs share a host:port
  # (assertNoServiceUrlCollisions, PRA-067). Keep this comment in sync with
  # that registry — the previous "(no conflicts)" claim was FALSE.
  #
  # Port assignments:
  #   declaration-service:  8083  (gRPC: 50051)
  #   payment-service:      8082  (gRPC: 50053)
  #   oga-service:          8084  (gRPC: 50054)
  #   analytics-service:    8085  (gRPC: 50055)
  #   tigerbeetle-bridge:   8086  (gRPC: 9086)  ← canonical money-rail bridge
  #   profile-service:      8097  (gRPC: 50056) ← canonical owner of 8097
  #   risk-engine:          8087  (gRPC: 50052) ← KNOWN COLLISION: 8087 is
  #                         canonically owned by keycloak-svc (PORTS.keycloakSvc,
  #                         Go bind default 8087). Gateway default for
  #                         RISK_ENGINE_URL moved off to 8111-block; compose
  #                         deployments MUST set RISK_ENGINE_URL=http://risk-engine:8087
  #                         explicitly (container DNS is unambiguous).
  #   cargo-tracking:       8088  (gRPC: 50057)
  #   sanctions-service:    8089  (gRPC: 50058)
  #   temporal-worker:      8090
  #   anomaly-detection:    8091  (no PORTS-registry conflict; gateway default matches)
  #   gnn-risk:             8092  (no PORTS-registry conflict; gateway default matches.
  #                         Historical note: the legacy services/python/vision-service
  #                         also defaulted to 8092 — it was REMOVED for AGPL
  #                         compliance (Ultralytics YOLOv8) in phase-10 remediation
  #                         and replaced by microservices/vision-service (YOLOX-s
  #                         ONNX, Apache-2.0).)
  #   hs-classifier:        8093  ← KNOWN COLLISION: 8093 is canonically owned by
  #                         cen-service (PORTS.cenService, Go bind default 8093,
  #                         P0-7 renumber). Gateway HS_CLASSIFIER_URL default
  #                         moved off; set HS_CLASSIFIER_URL=http://hs-classifier:8093
  #                         explicitly in compose. SHOULD be renumbered here.
  #   risk-ai:              8094
  #   vision-service:       8095  ← KNOWN DIVERGENCE: PORTS.visionService is 8105
  #                         (no real service binds 8105 — fail-closed placeholder).
  #                         This compose service is the vision-OCR probe target
  #                         (VISION_SVC_URL, default 8095, matches). Set
  #                         VISION_SERVICE_URL explicitly for the NLP/vision API.
  #   fluvio-consumer:      8096  ← KNOWN COLLISION: 8096 is canonically owned by
  #                         asean-sw-service (PORTS.aseanSwService, Go bind
  #                         default 8096). Gateway FLUVIO_CONSUMER_URL default
  #                         moved off; set FLUVIO_CONSUMER_URL=http://fluvio-consumer:8096
  #                         explicitly in compose. SHOULD be renumbered here.
  #
  # Historical note: an earlier wave-4 flag listed anomaly-detection 8091 vs
  # aseanSwService and gnn-risk 8092 vs freeZoneService as collisions. Those
  # were resolved when PORTS was aligned to the real Go bind defaults
  # (asean-sw-service → 8096, freezone-service → 8098); the collisions above
  # are the ones that remain.

  # ── Declaration Service (Go) ─────────────────────────────────────────────────
  declaration-service:
    build:
      context: ./microservices/declaration-service
      dockerfile: Dockerfile
    container_name: tg-declaration-svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8083
      GRPC_PORT: 50051
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "8083:8083"
      - "50051:50051"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Payment Service (Go) ─────────────────────────────────────────────────────
  payment-service:
    build:
      context: ./microservices/payment-service
      dockerfile: Dockerfile
    container_name: tg-payment-svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8082
      GRPC_PORT: 50053
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
      MOJALOOP_HUB_URL: ${MOJALOOP_HUB_URL:-http://mojaloop-hub:3001}
    ports:
      - "8082:8082"
      - "50053:50053"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── OGA Service (Go) ─────────────────────────────────────────────────────────
  oga-service:
    build:
      context: ./microservices/oga-service
      dockerfile: Dockerfile
    container_name: tg-oga-svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8084
      GRPC_PORT: 50054
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8084:8084"
      - "50054:50054"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Analytics Service (Go) ───────────────────────────────────────────────────
  analytics-service:
    build:
      context: ./microservices/analytics-service
      dockerfile: Dockerfile
    container_name: tg-analytics-svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8085
      GRPC_PORT: 50055
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8085:8085"
      - "50055:50055"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Profile Service (Go) ─────────────────────────────────────────────────────
  profile-service:
    build:
      context: ./microservices/profile-service
      dockerfile: Dockerfile
    container_name: tg-profile-svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8097
      GRPC_PORT: 50056
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8097:8097"
      - "50056:50056"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Risk Engine (Go + Python) ────────────────────────────────────────────────
  risk-engine:
    build:
      context: ./microservices/risk-engine
      dockerfile: Dockerfile
    container_name: tg-risk-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8087
      GRPC_PORT: 50052
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
      GNN_RISK_URL: http://gnn-risk:8092
      ANOMALY_DETECTION_URL: http://anomaly-detection:8091
    ports:
      - "8087:8087"
      - "50052:50052"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Cargo Tracking Service (Go) ──────────────────────────────────────────────
  cargo-tracking-service:
    build:
      context: ./microservices/cargo-tracking-service
      dockerfile: Dockerfile
    container_name: tg-cargo-tracking
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8088
      GRPC_PORT: 50057
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8088:8088"
      - "50057:50057"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Sanctions Service (Go) ───────────────────────────────────────────────────
  sanctions-service:
    build:
      context: ./microservices/sanctions-service
      dockerfile: Dockerfile
    container_name: tg-sanctions-svc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8089
      GRPC_PORT: 50058
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      OFAC_API_URL: ${OFAC_API_URL:-https://api.trade.gov/consolidated_screening_list/search}
      OFAC_API_KEY: ${OFAC_API_KEY:-}
    ports:
      - "8089:8089"
      - "50058:50058"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Temporal Worker (Go) ─────────────────────────────────────────────────────
  temporal-worker:
    build:
      context: ./microservices/temporal-worker
      dockerfile: Dockerfile
    container_name: tg-temporal-worker
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      PORT: 8090
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-tradegateway}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8090:8090"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Anomaly Detection (Python) ───────────────────────────────────────────────
  anomaly-detection:
    build:
      context: ./microservices/anomaly-detection
      dockerfile: Dockerfile
    container_name: tg-anomaly-detection
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8091
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8091:8091"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── GNN Risk (Python) ────────────────────────────────────────────────────────
  gnn-risk:
    build:
      context: ./microservices/gnn-risk
      dockerfile: Dockerfile
    container_name: tg-gnn-risk
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8092
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8092:8092"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── HS Classifier (Python) ───────────────────────────────────────────────────
  hs-classifier:
    build:
      context: ./microservices/hs-classifier
      dockerfile: Dockerfile
    container_name: tg-hs-classifier
    restart: unless-stopped
    environment:
      PORT: 8093
    ports:
      - "8093:8093"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── Risk AI (Python) ─────────────────────────────────────────────────────────
  risk-ai:
    build:
      context: ./microservices/risk-ai
      dockerfile: Dockerfile
    container_name: tg-risk-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8094
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
    ports:
      - "8094:8094"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── Vision Service (Python) ──────────────────────────────────────────────────
  vision-service:
    build:
      context: ./microservices/vision-service
      dockerfile: Dockerfile
    container_name: tg-vision-svc
    restart: unless-stopped
    environment:
      PORT: 8095
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "8095:8095"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── Fluvio Consumer (Go) ─────────────────────────────────────────────────────
  fluvio-consumer:
    build:
      context: ./microservices/fluvio-consumer
      dockerfile: Dockerfile
    container_name: tg-fluvio-consumer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8096
      FLUVIO_ENDPOINT: ${FLUVIO_ENDPOINT:-localhost:9003}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
    ports:
      - "8096:8096"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Polyglot Services (Sprint R) ────────────────────────────────────────────

  # ── AI Risk Scorer (Python / FastAPI + XGBoost) ──────────────────────────────
  ai-risk-scorer:
    build:
      context: ./services/ai-risk-scorer
      dockerfile: Dockerfile
    container_name: tg-ai-risk-scorer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8001"
      WORKERS: "4"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
      MODEL_PATH: /app/models/risk_model.pkl
    volumes:
      - ./services/ai-risk-scorer/models:/app/models:ro
    ports:
      - "8001:8001"
      - "9096:9096"   # Prometheus metrics
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── OpenSearch Indexer (Python / Kafka consumer) ──────────────────────────────
  opensearch-indexer:
    build:
      context: ./services/opensearch-indexer
      dockerfile: Dockerfile
    container_name: tg-opensearch-indexer
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_GROUP_ID: opensearch-indexer
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: ${OPENSEARCH_PASSWORD:-TradeGateway@2026!}
      BULK_BATCH_SIZE: "100"
      BULK_FLUSH_INTERVAL_SECONDS: "5"
    networks:
      - tradegateway-net

  # ── Kafka Consumer (Rust / domain event processor) ───────────────────────────
  kafka-consumer-rust:
    build:
      context: ./services/kafka-consumer
      dockerfile: Dockerfile
    container_name: tg-kafka-consumer-rust
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_GROUP_ID: tradegateway-rust-consumer
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: ${OPENSEARCH_PASSWORD:-TradeGateway@2026!}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tradegateway_redis_2026}@redis:6379
    networks:
      - tradegateway-net

  # ── TigerBeetle Bridge (canonical Go ledger service, HTTP /api/ledger/*) ──────
  # SW-O3: THE canonical money-rail bridge. The Rust gRPC bridges are dev-only
  # (TB_ALLOW_SIM_BACKEND=1) and were removed from all deploy surfaces.
  # Production images must be built from Dockerfile.production (-tags tigerbeetle,
  # live TB backend). The default build is the DEV-only sim backend, which
  # refuses to boot when ENVIRONMENT=production.
  tigerbeetle-bridge:
    build:
      context: ./services/go/tigerbeetle-bridge
      dockerfile: Dockerfile
    container_name: tg-tigerbeetle-bridge
    restart: unless-stopped
    depends_on:
      tigerbeetle:
        condition: service_started
    environment:
      TB_BRIDGE_HTTP_PORT: "8086"
      TB_BRIDGE_GRPC_PORT: "9086"
      TIGERBEETLE_ADDR: ${TIGERBEETLE_ADDR:-tigerbeetle:3000}
      TB_ALLOW_SIM_BACKEND: ${TB_ALLOW_SIM_BACKEND:-}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "8086:8086"
      - "9086:9086"
    networks:
      - tradegateway-net
    healthcheck:
      # distroless image: no shell/wget — the binary serves its own probe
      test: ["CMD", "/tigerbeetle-bridge", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── TigerBeetle (ledger datastore) ───────────────────────────────────────────
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.11
    container_name: tg-tigerbeetle
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ ! -f /var/lib/tigerbeetle/0_0.tigerbeetle ]; then
          /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /var/lib/tigerbeetle/0_0.tigerbeetle;
        fi;
        exec /tigerbeetle start --addresses=0.0.0.0:3000 /var/lib/tigerbeetle/0_0.tigerbeetle
    volumes:
      - tigerbeetle_data:/var/lib/tigerbeetle
    networks:
      - tradegateway-net

  # ── Flink Lakehouse Pipeline (Python) ────────────────────────────────────────
  flink-pipeline:
    build:
      context: ./infra/lakehouse
      dockerfile: Dockerfile.flink
    container_name: tg-flink-pipeline
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      DELTA_LAKE_PATH: /data/delta
      POSTGRES_URL: postgresql://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}
      OPENSEARCH_URL: https://opensearch:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: ${OPENSEARCH_PASSWORD:-TradeGateway@2026!}
      PIPELINE_MODE: ${PIPELINE_MODE:-batch}
    volumes:
      - ./data/delta:/data/delta
    networks:
      - tradegateway-net

  # ── Zookeeper (Kafka dependency) ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: tg-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    ports:
      - "2181:2181"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tg-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Keycloak 24 ───────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: tg-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tradegateway}
      KC_DB_USERNAME: ${POSTGRES_USER:-tradegateway}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-tradegateway_secure_2026}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secure_2026}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Permify v0.9 ─────────────────────────────────────────────────────────────
  permify:
    image: ghcr.io/permify/permify:v0.9.6
    container_name: tg-permify
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://${POSTGRES_USER:-tradegateway}:${POSTGRES_PASSWORD:-tradegateway_secure_2026}@postgres:5432/${POSTGRES_DB:-tradegateway}?sslmode=disable
      PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: "20"
      PERMIFY_SERVER_HTTP_PORT: "3476"
      PERMIFY_SERVER_GRPC_PORT: "3478"
      PERMIFY_LOG_LEVEL: info
      PERMIFY_AUTHN_ENABLED: "false"
    volumes:
      - ./permify/schema.perm:/etc/permify/schema.perm:ro
    ports:
      - "3476:3476"
      - "3478:3478"
    networks:
      - tradegateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3476/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
