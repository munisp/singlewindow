# TradeGateway™ NGSWTP — Helm Chart Default Values
# Override these values in values.prod.yaml or via --set flags.
# All secrets should be provided via Kubernetes Secrets, not hardcoded here.

# ─── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# ─── TradeGateway Application ──────────────────────────────────────────────────
app:
  enabled: true
  name: tradegateway-app
  replicaCount: 2

  image:
    repository: ghcr.io/munisp/tradegateway
    tag: "v60"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    NODE_ENV: production
    PORT: "9000"
    DEMO_MODE: "false"

  # Secret references — create these Kubernetes Secrets before deploying
  # kubectl create secret generic tradegateway-secrets --from-env-file=.env
  secretName: tradegateway-secrets

  # startupProbe: allows up to 90s (18 * 5s) for cold-start before liveness kicks in.
  # Accommodates DB migrations, Keycloak token fetch, and TigerBeetle seed on startup.
  startupProbe:
    httpGet:
      path: /api/health
      port: 9000
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 18    # 18 * 5s = 90s max startup window
    successThreshold: 1
    timeoutSeconds: 3

  # livenessProbe: restarts the pod if /api/health fails 3 consecutive times.
  # Only active after startupProbe succeeds.
  livenessProbe:
    httpGet:
      path: /api/health
      port: 9000
    initialDelaySeconds: 0   # startupProbe guards the initial window
    periodSeconds: 15
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

  # readinessProbe: removes pod from Service endpoints when unhealthy.
  # Uses /api/health which verifies DB + Redis connectivity.
  readinessProbe:
    httpGet:
      path: /api/health
      port: 9000
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 5

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─── PostgreSQL ────────────────────────────────────────────────────────────────
# Uses Bitnami PostgreSQL chart as a dependency (see Chart.yaml)
postgresql:
  enabled: true
  auth:
    username: tradegateway
    database: tradegateway
    # Password set via existingSecret in production
    existingSecret: tradegateway-postgres-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    initdb:
      scripts:
        create-schemas.sql: |
          CREATE SCHEMA IF NOT EXISTS keycloak;
          CREATE SCHEMA IF NOT EXISTS permify;

# ─── Redis ─────────────────────────────────────────────────────────────────────
# Uses Bitnami Redis chart as a dependency (see Chart.yaml)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: tradegateway-redis-secret
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ─── Keycloak ──────────────────────────────────────────────────────────────────
keycloak:
  enabled: true
  name: keycloak
  replicaCount: 1

  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0.4"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    httpPort: 8080
    httpsPort: 8443

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  env:
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_HTTPS: "false"
    KC_HTTP_ENABLED: "true"
    KC_HEALTH_ENABLED: "true"
    KC_METRICS_ENABLED: "true"
    KC_LOG_LEVEL: INFO
    KC_DB: postgres

  secretName: tradegateway-keycloak-secret

  realmImport:
    enabled: true
    configMapName: keycloak-realm-config

  persistence:
    enabled: true
    size: 2Gi

# ─── Permify ───────────────────────────────────────────────────────────────────
permify:
  enabled: true
  name: permify
  replicaCount: 1

  image:
    repository: ghcr.io/permify/permify
    tag: "v0.9.6"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    httpPort: 3476
    grpcPort: 3478

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  env:
    PERMIFY_SERVER_HTTP_PORT: "3476"
    PERMIFY_SERVER_GRPC_PORT: "3478"
    PERMIFY_LOG_LEVEL: info
    PERMIFY_AUTHN_ENABLED: "false"
    PERMIFY_DATABASE_ENGINE: postgres
    PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: "20"

  secretName: tradegateway-permify-secret

  schemaConfigMap: permify-schema-config

# ─── OpenSearch ────────────────────────────────────────────────────────────────
opensearch:
  enabled: true
  name: opensearch
  replicaCount: 1

  image:
    repository: opensearchproject/opensearch
    tag: "2.13.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    httpPort: 9200
    transportPort: 9300

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  persistence:
    enabled: true
    size: 30Gi

  env:
    discovery.type: single-node
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    DISABLE_SECURITY_PLUGIN: "true"
    OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"

  jvmOptions: "-Xms1g -Xmx1g"

# ─── Kafka ─────────────────────────────────────────────────────────────────────
kafka:
  enabled: true
  name: kafka
  replicaCount: 1

  image:
    repository: confluentinc/cp-kafka
    tag: "7.6.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 29092
    externalPort: 9092

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  persistence:
    enabled: true
    size: 20Gi

  env:
    KAFKA_BROKER_ID: "1"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_LOG_RETENTION_HOURS: "168"

# ─── Zookeeper (Kafka dependency) ──────────────────────────────────────────────
zookeeper:
  enabled: true
  name: zookeeper
  replicaCount: 1

  image:
    repository: confluentinc/cp-zookeeper
    tag: "7.6.1"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    clientPort: 2181

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    size: 5Gi

# ─── APISIX API Gateway ────────────────────────────────────────────────────────
apisix:
  enabled: true
  name: apisix
  replicaCount: 2

  image:
    repository: apache/apisix
    tag: "3.9.1-debian"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    httpPort: 80
    httpsPort: 443
    adminPort: 9180

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  config:
    adminKey: "tradegateway-apisix-admin-key-change-in-production"

# ─── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: tradegateway.example.com
      paths:
        - path: /
          pathType: Prefix
          service: app
        - path: /auth
          pathType: Prefix
          service: keycloak
  tls:
    - secretName: tradegateway-tls
      hosts:
        - tradegateway.example.com

# ─── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ─── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false

# ─── Pod Disruption Budget ─────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ─── PostgreSQL (standalone StatefulSet — used by templates/postgres-statefulset.yaml) ──
# Note: The `postgresql` section above uses Bitnami chart dependency.
# This `postgres` section is for the standalone StatefulSet template.
postgres:
  enabled: false  # disabled by default — use postgresql (Bitnami) instead
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: tradegateway
  storage: 20Gi
  storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ─── Temporal ────────────────────────────────────────────────────────────────
temporal:
  host: temporal-frontend
  port: "7233"
  namespace: tradegateway

# ─── Fluvio ──────────────────────────────────────────────────────────────────
fluvio:
  endpoint: "fluvio-sc:9003"
  tlsEnabled: "false"

# ─── TigerBeetle ─────────────────────────────────────────────────────────────
tigerbeetle:
  address: "tigerbeetle:3000"
  clusterId: "0"

# ─── Mojaloop ────────────────────────────────────────────────────────────────
mojaloop:
  fspiopUrl: "http://ml-api-adapter:3000"
  alsUrl: "http://account-lookup-service:4002"
  quotesUrl: "http://quoting-service:3002"
  transfersUrl: "http://ml-api-adapter:3000"
  dfspId: "tradegateway"

# ─── Delta Lake / Lakehouse ───────────────────────────────────────────────────
deltalake:
  serviceUrl: "http://deltalake-svc:8080"
  s3Bucket: "tradegateway-lakehouse"
  s3Endpoint: "http://minio:9000"

# ─── Autoscaling (cross-service HPA via templates/hpa.yaml) ──────────────────
autoscaling:
  enabled: false
  app:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  opensearch:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

# ─── Secrets (override in production via external-secrets or sealed-secrets) ──
# WARNING: Do NOT commit real credentials. Use a secrets manager in production.
secrets:
  postgresUser: "tradegateway"
  postgresPassword: "CHANGE_ME_POSTGRES"
  redisPassword: "CHANGE_ME_REDIS"
  jwtSecret: "CHANGE_ME_JWT_SECRET_32_CHARS_MIN"
  keycloakAdminPassword: "CHANGE_ME_KEYCLOAK_ADMIN"
  keycloakClientSecret: "CHANGE_ME_KEYCLOAK_CLIENT_SECRET"
  permifyApiKey: "CHANGE_ME_PERMIFY_API_KEY"
  tigerbeetleClusterId: "0"
  mojaloopClientKey: ""
  mojaloopClientCert: ""
  mojaloopCaCert: ""
  s3AccessKeyId: "CHANGE_ME_S3_ACCESS_KEY"
  s3SecretAccessKey: "CHANGE_ME_S3_SECRET_KEY"
  apisixAdminKey: "CHANGE_ME_APISIX_ADMIN_KEY"
  fluvioTlsCert: ""
  fluvioTlsKey: ""
  wazuhApiKey: "CHANGE_ME_WAZUH_API_KEY"
  openctiApiKey: "CHANGE_ME_OPENCTI_API_KEY"
  forgeApiKey: "CHANGE_ME_FORGE_API_KEY"
  viteFrontendForgeApiKey: "CHANGE_ME_VITE_FORGE_API_KEY"

# ─── OpenSearch index prefix and Redis standalone extra fields are merged above ─
# (indexPrefix is set in the opensearch section; maxmemory in the redis section)

# ─── Temporal Workflow Worker ─────────────────────────────────────────────────
# Dedicated Go binary that registers all 20 fund-flow workflows and activities
# with the Temporal server. Exposes /live, /ready, /health on healthPort.
workflowWorker:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/munisp/tradegateway-workflow-worker
    tag: "v64"
    pullPolicy: IfNotPresent

  # Health check port — matches WORKER_HEALTH_PORT env var in the Go binary
  healthPort: 8090

  # Middleware URLs injected as environment variables
  tigerbeetleBridgeUrl: "http://tigerbeetle-bridge:4600"
  kafkaRestUrl: "http://kafka-rest-proxy:8082"
  fluvioHttpUrl: "http://fluvio-sc:9003"

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
