{{- if .Values.permify.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tradegateway.fullname" . }}-permify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tradegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: permify
spec:
  replicas: {{ .Values.permify.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tradegateway.fullname" . }}-permify
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tradegateway.fullname" . }}-permify
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: permify
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: permify
          image: "{{ .Values.permify.image.repository }}:{{ .Values.permify.image.tag }}"
          imagePullPolicy: {{ .Values.permify.image.pullPolicy }}
          args:
            - serve
          ports:
            - name: http
              containerPort: 3476
              protocol: TCP
            - name: grpc
              containerPort: 3478
              protocol: TCP
          env:
            {{- range $key, $value := .Values.permify.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PERMIFY_DATABASE_URI
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?search_path=permify&sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3476
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3476
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.permify.resources | nindent 12 }}
          {{- if .Values.permify.schemaConfigMap }}
          volumeMounts:
            - name: schema-config
              mountPath: /app/schema
              readOnly: true
          {{- end }}
      {{- if .Values.permify.schemaConfigMap }}
      volumes:
        - name: schema-config
          configMap:
            name: {{ .Values.permify.schemaConfigMap }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tradegateway.fullname" . }}-permify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tradegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: permify
spec:
  type: {{ .Values.permify.service.type }}
  ports:
    - port: {{ .Values.permify.service.httpPort }}
      targetPort: 3476
      protocol: TCP
      name: http
    - port: {{ .Values.permify.service.grpcPort }}
      targetPort: 3478
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: {{ include "tradegateway.fullname" . }}-permify
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
