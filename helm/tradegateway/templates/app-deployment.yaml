{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tradegateway.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tradegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tradegateway.fullname" . }}-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tradegateway.fullname" . }}-app
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
        {{- with .Values.app.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tradegateway.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: tradegateway
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Database
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}
            - name: DATABASE_URL
              value: {{ include "tradegateway.postgresUrl" . }}
            # Redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey }}
            - name: REDIS_URL
              value: {{ include "tradegateway.redisUrl" . }}
            # Kafka
            - name: KAFKA_BROKERS
              value: {{ include "tradegateway.kafkaBrokers" . }}
            # Keycloak
            - name: KEYCLOAK_URL
              value: {{ include "tradegateway.keycloakUrl" . }}
            # Permify
            - name: PERMIFY_GRPC_ENDPOINT
              value: {{ include "tradegateway.permifyGrpc" . }}
            # OpenSearch
            - name: OPENSEARCH_URL
              value: {{ include "tradegateway.opensearchUrl" . }}
            # Application secrets from Kubernetes Secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: JWT_SECRET
            - name: VITE_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: VITE_APP_ID
                  optional: true
            - name: OAUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: OAUTH_SERVER_URL
                  optional: true
            - name: BUILT_IN_FORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secretName }}
                  key: BUILT_IN_FORGE_API_KEY
                  optional: true
          {{- if .Values.app.startupProbe }}
          startupProbe:
            {{- toYaml .Values.app.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tradegateway.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tradegateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "tradegateway.fullname" . }}-app
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.app.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tradegateway.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tradegateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tradegateway.fullname" . }}-app
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- end }}
