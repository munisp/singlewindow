{{- /*
  Secrets template — all sensitive credentials for TradeGateway NGSWTP.
  Values are base64-encoded by Helm automatically when using the `b64enc` function.
  In production, use an external secrets manager (Vault, AWS Secrets Manager, GCP Secret Manager)
  and reference secrets via ExternalSecret (external-secrets.io) instead of hardcoding here.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tradegateway.fullname" . }}-secrets
  labels:
    {{- include "tradegateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # ─── Database ────────────────────────────────────────────────────────────────
  postgres-user: {{ .Values.secrets.postgresUser | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword (include "tradegateway.fullname" .) .Values.postgres.database | quote }}

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis:6379" .Values.secrets.redisPassword (include "tradegateway.fullname" .) | quote }}

  # ─── JWT / Session ───────────────────────────────────────────────────────────
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}

  # ─── Keycloak ────────────────────────────────────────────────────────────────
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret | quote }}

  # ─── Permify ─────────────────────────────────────────────────────────────────
  permify-api-key: {{ .Values.secrets.permifyApiKey | quote }}

  # ─── TigerBeetle ─────────────────────────────────────────────────────────────
  tigerbeetle-cluster-id: {{ .Values.secrets.tigerbeetleClusterId | quote }}

  # ─── Mojaloop ────────────────────────────────────────────────────────────────
  mojaloop-client-key: {{ .Values.secrets.mojaloopClientKey | quote }}
  mojaloop-client-cert: {{ .Values.secrets.mojaloopClientCert | quote }}
  mojaloop-ca-cert: {{ .Values.secrets.mojaloopCaCert | quote }}

  # ─── S3 / Delta Lake ─────────────────────────────────────────────────────────
  s3-access-key-id: {{ .Values.secrets.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | quote }}

  # ─── APISIX ──────────────────────────────────────────────────────────────────
  apisix-admin-key: {{ .Values.secrets.apisixAdminKey | quote }}

  # ─── Fluvio ──────────────────────────────────────────────────────────────────
  fluvio-tls-cert: {{ .Values.secrets.fluvioTlsCert | quote }}
  fluvio-tls-key: {{ .Values.secrets.fluvioTlsKey | quote }}

  # ─── Wazuh ───────────────────────────────────────────────────────────────────
  wazuh-api-key: {{ .Values.secrets.wazuhApiKey | quote }}

  # ─── OpenCTI ─────────────────────────────────────────────────────────────────
  opencti-api-key: {{ .Values.secrets.openctiApiKey | quote }}

  # ─── Manus Forge (LLM / Storage / Notifications) ─────────────────────────────
  forge-api-key: {{ .Values.secrets.forgeApiKey | quote }}
  vite-frontend-forge-api-key: {{ .Values.secrets.viteFrontendForgeApiKey | quote }}
