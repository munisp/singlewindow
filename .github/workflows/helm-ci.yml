name: Helm Chart CI

on:
  push:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-ci.yml"

concurrency:
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint both value sets ───────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        values:
          - name: "local-pvc (default)"
            file: "deploy/helm/rustfs/values.yaml"
          - name: "openstack-swift"
            file: "deploy/helm/rustfs/values-openstack.yaml"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.4"

      - name: Helm lint — ${{ matrix.values.name }}
        run: |
          helm lint deploy/helm/rustfs \
            --values ${{ matrix.values.file }} \
            --strict

  # ── Job 2: Template rendering validation ─────────────────────────────────
  helm-template:
    name: Helm Template
    runs-on: ubuntu-latest
    needs: helm-lint
    strategy:
      fail-fast: false
      matrix:
        values:
          - name: "local-pvc"
            file: "deploy/helm/rustfs/values.yaml"
            release: "rustfs-local"
          - name: "openstack-swift"
            file: "deploy/helm/rustfs/values-openstack.yaml"
            release: "rustfs-swift"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.4"

      - name: Helm template — ${{ matrix.values.name }}
        run: |
          helm template ${{ matrix.release }} deploy/helm/rustfs \
            --values ${{ matrix.values.file }} \
            --namespace tradegateway-storage \
            --debug \
            > /tmp/rendered-${{ matrix.values.name }}.yaml

      - name: Validate rendered YAML is non-empty
        run: |
          lines=$(wc -l < /tmp/rendered-${{ matrix.values.name }}.yaml)
          echo "Rendered $lines lines for ${{ matrix.values.name }}"
          [ "$lines" -gt 10 ] || (echo "ERROR: Rendered manifest is suspiciously short" && exit 1)

      - name: Upload rendered manifests as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered-${{ matrix.values.name }}
          path: /tmp/rendered-${{ matrix.values.name }}.yaml
          retention-days: 7

  # ── Job 3: Kubernetes manifest validation with kubeconform ───────────────
  kubeconform:
    name: Kubeconform Validation
    runs-on: ubuntu-latest
    needs: helm-template
    strategy:
      fail-fast: false
      matrix:
        values:
          - name: "local-pvc"
            file: "deploy/helm/rustfs/values.yaml"
          - name: "openstack-swift"
            file: "deploy/helm/rustfs/values-openstack.yaml"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.4"

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          chmod +x /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render and validate — ${{ matrix.values.name }}
        run: |
          helm template rustfs deploy/helm/rustfs \
            --values ${{ matrix.values.file }} \
            --namespace tradegateway-storage | \
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.28.0 \
            -summary

  # ── Job 4: Chart packaging ────────────────────────────────────────────────
  helm-package:
    name: Helm Package
    runs-on: ubuntu-latest
    needs: [helm-lint, helm-template]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.4"

      - name: Package chart
        run: |
          helm package deploy/helm/rustfs --destination /tmp/helm-packages/
          ls -la /tmp/helm-packages/

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-package
          path: /tmp/helm-packages/*.tgz
          retention-days: 30
