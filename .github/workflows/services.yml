name: Services CI — Go & Rust

# Runs on every push and PR that touches Go or Rust service code.
# Complements the existing ci.yml (TypeScript) and ci-cd.yml (full pipeline).
#
# Jobs:
#   detect-changes   — path-filtered change detection (skip unchanged services)
#   go-test-matrix   — go test ./... -race for each Go service in parallel
#   rust-test-matrix — cargo test for each Rust crate in parallel
#   summary          — aggregates results and posts a PR comment
#
# Services covered:
#   Go:
#     - services/go/payment-service
#     - services/go/workflow-service       (Temporal worker + health endpoint)
#     - services/go/mojaloop-gateway       (DFSP registration + JWS signing)
#   Rust:
#     - services/rust/tigerbeetle-bridge-rs (TigerBeetle ledger + seeding)

on:
  push:
    branches: [main, develop, "release/**", "v6*"]
    paths:
      - "services/go/**"
      - "services/rust/**"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/go/**"
      - "services/rust/**"
      - ".github/workflows/services.yml"

env:
  GO_VERSION: "1.23"
  RUST_TOOLCHAIN: "stable"

# Cancel in-progress runs on the same branch to save CI minutes.
concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change detection ────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      payment-service: ${{ steps.filter.outputs.payment-service }}
      workflow-service: ${{ steps.filter.outputs.workflow-service }}
      mojaloop-gateway: ${{ steps.filter.outputs.mojaloop-gateway }}
      tigerbeetle-bridge-rs: ${{ steps.filter.outputs.tigerbeetle-bridge-rs }}
      any-go: ${{ steps.filter.outputs.any-go }}
      any-rust: ${{ steps.filter.outputs.any-rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            payment-service:
              - 'services/go/payment-service/**'
            workflow-service:
              - 'services/go/workflow-service/**'
            mojaloop-gateway:
              - 'services/go/mojaloop-gateway/**'
            tigerbeetle-bridge-rs:
              - 'services/rust/tigerbeetle-bridge-rs/**'
            any-go:
              - 'services/go/**'
            any-rust:
              - 'services/rust/**'

  # ─── Go service tests ────────────────────────────────────────────────────────
  go-test-matrix:
    name: Go — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    # Run on main always; on PRs only if the service changed.
    if: |
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.any-go == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: payment-service
            path: services/go/payment-service
            changed: ${{ needs.detect-changes.outputs.payment-service }}
            timeout: 90s
          - name: workflow-service
            path: services/go/workflow-service
            changed: ${{ needs.detect-changes.outputs.workflow-service }}
            timeout: 120s
          - name: mojaloop-gateway
            path: services/go/mojaloop-gateway
            changed: ${{ needs.detect-changes.outputs.mojaloop-gateway }}
            timeout: 90s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service.path }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.service.path }}
        run: go mod download

      - name: Verify go.sum
        working-directory: ${{ matrix.service.path }}
        run: go mod verify

      - name: Run vet
        working-directory: ${{ matrix.service.path }}
        run: go vet ./...

      - name: Run tests (race detector)
        working-directory: ${{ matrix.service.path }}
        run: |
          go test ./... \
            -v \
            -race \
            -timeout ${{ matrix.service.timeout }} \
            -coverprofile=coverage.out \
            -covermode=atomic
        env:
          # Provide stub env vars so tests that read os.Getenv don't fail.
          TEMPORAL_HOST: "localhost:7233"
          DFSP_JWS_PRIVATE_KEY_PATH: ""
          TIGERBEETLE_ADDR: "localhost:3000"
          MOJALOOP_HUB_URL: "http://localhost:4000"
          MOJALOOP_DFSP_ID: "tradegateway-test"
          KAFKA_BROKERS: "localhost:9092"
          REDIS_ADDR: "localhost:6379"
          DATABASE_URL: "postgres://test:test@localhost:5432/test_db"
          WORKER_HEALTH_PORT: "0"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.path }}/coverage.out
          retention-days: 7

  # ─── Rust crate tests ────────────────────────────────────────────────────────
  rust-test-matrix:
    name: Rust — ${{ matrix.crate.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.any-rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: tigerbeetle-bridge-rs
            path: services/rust/tigerbeetle-bridge-rs
            changed: ${{ needs.detect-changes.outputs.tigerbeetle-bridge-rs }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.crate.path }}/target
          key: rust-${{ matrix.crate.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate.path)) }}
          restore-keys: |
            rust-${{ matrix.crate.name }}-

      - name: Check formatting
        working-directory: ${{ matrix.crate.path }}
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: ${{ matrix.crate.path }}
        run: cargo clippy --all-targets --all-features -- -D warnings
        # Stub out TigerBeetle connection so clippy can analyse without a live server.
        env:
          TIGERBEETLE_ADDR: "localhost:3000"

      - name: Run tests (no default features — no live TigerBeetle required)
        working-directory: ${{ matrix.crate.path }}
        run: |
          cargo test \
            --no-default-features \
            --lib \
            --bins \
            -- \
            --test-threads=4
        env:
          TIGERBEETLE_ADDR: "localhost:3000"
          RUST_BACKTRACE: "1"

      - name: Build release binary
        working-directory: ${{ matrix.crate.path }}
        run: cargo build --release --no-default-features
        env:
          TIGERBEETLE_ADDR: "localhost:3000"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-${{ matrix.crate.name }}
          path: ${{ matrix.crate.path }}/target/release/tigerbeetle-bridge
          retention-days: 7

  # ─── JWS signing integration test ───────────────────────────────────────────
  jws-integration:
    name: JWS Signing — mojaloop-gateway
    runs-on: ubuntu-latest
    needs: [detect-changes, go-test-matrix]
    if: |
      always() &&
      (github.ref == 'refs/heads/main' ||
       needs.detect-changes.outputs.mojaloop-gateway == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/mojaloop-gateway/go.sum

      - name: Generate test RSA key
        run: |
          openssl genrsa -out /tmp/test-dfsp.pem 2048
          echo "DFSP_JWS_PRIVATE_KEY_PATH=/tmp/test-dfsp.pem" >> $GITHUB_ENV

      - name: Run JWS tests with real key file
        working-directory: services/go/mojaloop-gateway
        run: |
          go test ./internal/dfsp/... \
            -v \
            -run TestJWS \
            -timeout 30s
        env:
          DFSP_JWS_PRIVATE_KEY_PATH: /tmp/test-dfsp.pem
          MOJALOOP_DFSP_ID: "tradegateway-ci"

      - name: Run all DFSP tests (sign, verify, registration)
        working-directory: services/go/mojaloop-gateway
        run: |
          go test ./internal/dfsp/... \
            -v \
            -race \
            -timeout 60s
        env:
          DFSP_JWS_PRIVATE_KEY_PATH: /tmp/test-dfsp.pem
          MOJALOOP_DFSP_ID: "tradegateway-ci"
          MOJALOOP_HUB_URL: "http://localhost:4000"

  # ─── Temporal worker health test ─────────────────────────────────────────────
  worker-health:
    name: Temporal Worker Health Endpoint
    runs-on: ubuntu-latest
    needs: [detect-changes, go-test-matrix]
    if: |
      always() &&
      (github.ref == 'refs/heads/main' ||
       needs.detect-changes.outputs.workflow-service == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/workflow-service/go.sum

      - name: Run health endpoint tests
        working-directory: services/go/workflow-service
        run: |
          go test ./cmd/worker/... \
            -v \
            -race \
            -run TestHealth \
            -timeout 30s
        env:
          TEMPORAL_HOST: "localhost:7233"
          WORKER_HEALTH_PORT: "0"

      - name: Run all worker tests
        working-directory: services/go/workflow-service
        run: |
          go test ./cmd/worker/... \
            -v \
            -race \
            -timeout 60s
        env:
          TEMPORAL_HOST: "localhost:7233"
          WORKER_HEALTH_PORT: "0"

  # ─── Summary ─────────────────────────────────────────────────────────────────
  summary:
    name: Services CI Summary
    runs-on: ubuntu-latest
    needs: [go-test-matrix, rust-test-matrix, jws-integration, worker-health]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Go matrix:       ${{ needs.go-test-matrix.result }}"
          echo "Rust matrix:     ${{ needs.rust-test-matrix.result }}"
          echo "JWS integration: ${{ needs.jws-integration.result }}"
          echo "Worker health:   ${{ needs.worker-health.result }}"

          if [[ "${{ needs.go-test-matrix.result }}" == "failure" ]]; then
            echo "❌ Go service tests failed"
            exit 1
          fi
          if [[ "${{ needs.rust-test-matrix.result }}" == "failure" ]]; then
            echo "❌ Rust crate tests failed"
            exit 1
          fi
          if [[ "${{ needs.jws-integration.result }}" == "failure" ]]; then
            echo "❌ JWS integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.worker-health.result }}" == "failure" ]]; then
            echo "❌ Worker health tests failed"
            exit 1
          fi
          echo "✅ All service CI jobs passed"

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: coverage/

      - name: Display coverage summary
        run: |
          echo "## Go Service Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Coverage File |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------------|" >> $GITHUB_STEP_SUMMARY
          for f in coverage/go-coverage-*/coverage.out; do
            svc=$(basename $(dirname $f))
            lines=$(wc -l < $f 2>/dev/null || echo "N/A")
            echo "| $svc | $lines lines |" >> $GITHUB_STEP_SUMMARY
          done
