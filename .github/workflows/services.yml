# GitHub Actions CI Pipeline for Go microservices and Rust components
# v63: Covers payment-service, workflow-service, mojaloop-gateway (Go) and tigerbeetle-bridge-rs (Rust)
name: Services CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'v6*'
    paths:
      - 'services/go/**'
      - 'services/rust/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/go/**'
      - 'services/rust/**'

env:
  GO_VERSION: "1.23"
  RUST_TOOLCHAIN: "stable"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go-changed: ${{ steps.filter.outputs.go }}
      rust-changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'services/go/**'
            rust:
              - 'services/rust/**'

  go-test-matrix:
    needs: detect-changes
    if: needs.detect-changes.outputs.go-changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - workflow-service
          - mojaloop-gateway
    env:
      DATABASE_URL: mysql://test:test@localhost:3306/testdb
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
      TEMPORAL_HOST: localhost:7233
      TIGERBEETLE_ADDR: localhost:3000
      MOJALOOP_HUB_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.service }}-${{ hashFiles('services/go/${{ matrix.service }}/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.service }}-
      - name: Run tests with race detection
        working-directory: services/go/${{ matrix.service }}
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.service }}
          path: services/go/${{ matrix.service }}/coverage.out

  rust-test-matrix:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust-changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - tigerbeetle-bridge-rs
    env:
      TIGERBEETLE_ADDRESS: localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('services/rust/${{ matrix.crate }}/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.crate }}-
      - name: Check formatting
        working-directory: services/rust/${{ matrix.crate }}
        run: cargo fmt --check
      - name: Clippy (no warnings)
        working-directory: services/rust/${{ matrix.crate }}
        run: cargo clippy -- -D warnings
      - name: Run tests
        working-directory: services/rust/${{ matrix.crate }}
        run: cargo test
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-${{ matrix.crate }}
          path: services/rust/${{ matrix.crate }}/target/debug/${{ matrix.crate }}

  jws-integration:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      DFSP_JWS_PRIVATE_KEY_PATH: ./test-keys/jws-private.pem
      DFSP_JWS_PUBLIC_KEY_PATH: ./test-keys/jws-public.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Generate test JWS keys
        run: |
          mkdir -p test-keys
          openssl genrsa -out test-keys/jws-private.pem 2048
          openssl rsa -pubout -in test-keys/jws-private.pem -out test-keys/jws-public.pem
      - name: Run JWS signing integration tests
        working-directory: services/go/payment-service
        run: go test -run TestJWS ./...

  worker-health:
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      TEMPORAL_HOST: localhost:7233
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Temporal worker health endpoint tests
        working-directory: services/go/workflow-service
        run: go test -run TestWorkerHealth ./cmd/worker/...

  summary:
    needs:
      - go-test-matrix
      - rust-test-matrix
      - jws-integration
      - worker-health
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.go-test-matrix.result }}" == "failure" || \
                "${{ needs.rust-test-matrix.result }}" == "failure" || \
                "${{ needs.jws-integration.result }}" == "failure" || \
                "${{ needs.worker-health.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
