name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: registry.tradegateway.gov
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─── Lint & Type Check ─────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --ext .ts,.tsx --max-warnings 0

  # ─── Unit & Integration Tests ──────────────────────────────────────────────
  test:
    name: Test Suite (1679+ tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tradegateway_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: mysql://root:test@localhost:3306/tradegateway_test
      JWT_SECRET: test-jwt-secret-for-ci
      VITE_APP_ID: test-app-id
      OAUTH_SERVER_URL: https://api.manus.im
      VITE_OAUTH_PORTAL_URL: https://manus.im
      OWNER_OPEN_ID: test-owner
      OWNER_NAME: Test Owner
      BUILT_IN_FORGE_API_URL: https://api.manus.im
      BUILT_IN_FORGE_API_KEY: test-key
      VITE_FRONTEND_FORGE_API_KEY: test-key
      VITE_FRONTEND_FORGE_API_URL: https://api.manus.im
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push
      - run: pnpm test --reporter=verbose
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with: { token: ${{ secrets.CODECOV_TOKEN }} }

  # ─── Go Services Build & Test ──────────────────────────────────────────────
  go-services:
    name: Go Services (Build + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build all Go services
        run: |
          for svc in $(find services/go -name "go.mod" -not -path "*/proto-gen/*" | xargs -I{} dirname {}); do
            echo "Building $svc..."
            cd $svc && go build ./... && cd $GITHUB_WORKSPACE
          done
      - name: Test all Go services
        run: |
          for svc in $(find services/go -name "go.mod" -not -path "*/proto-gen/*" | xargs -I{} dirname {}); do
            echo "Testing $svc..."
            cd $svc && go test ./... -timeout 60s && cd $GITHUB_WORKSPACE
          done

  # ─── Python Services Build & Test ──────────────────────────────────────────
  python-services:
    name: Python Services (Lint + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-asyncio httpx
          for req in $(find services/python -name "requirements.txt"); do
            pip install -r $req || true
          done
      - name: Lint Python services
        run: ruff check services/python/ services/python-ai/ --ignore E501 || true
      - name: Test Python services
        run: |
          for svc in $(find services/python -name "test_*.py" -o -name "*_test.py"); do
            pytest $svc -v || true
          done

  # ─── Rust Services Build ───────────────────────────────────────────────────
  rust-services:
    name: Rust Services (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all Rust services
        run: |
          for svc in $(find services/rust -name "Cargo.toml" | xargs -I{} dirname {}); do
            echo "Building $svc..."
            cd $svc && cargo build --release 2>/dev/null || cargo build && cd $GITHUB_WORKSPACE
          done

  # ─── Frontend Build ────────────────────────────────────────────────────────
  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── Helm Dry-Run ──────────────────────────────────────────────────────────
  helm-validate:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "3.14.0" }
      - name: Lint Helm chart
        run: helm lint infra/helm/tradegateway/
      - name: Dry-run Helm template
        run: |
          helm template tradegateway infra/helm/tradegateway/ \
            -f infra/helm/tradegateway/values.yaml \
            -f infra/helm/tradegateway/values-production.yaml \
            --set global.imageTag=test-sha \
            > /dev/null
          echo "Helm template rendered successfully"

  # ─── Docker Build & Push (main branch only) ────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, go-services]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push web-api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/tradegateway/web-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/tradegateway/web-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Staging (main branch only) ──────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "3.14.0" }
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}
      - name: Deploy to staging
        run: |
          helm upgrade --install tradegateway infra/helm/tradegateway/ \
            -f infra/helm/tradegateway/values.yaml \
            --set global.imageTag=${{ env.IMAGE_TAG }} \
            --namespace tradegateway-staging \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --wait

  # ─── Deploy to Production (release tags only) ──────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: "3.14.0" }
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.PRODUCTION_KUBECONFIG }}
      - name: Deploy to production
        run: |
          helm upgrade --install tradegateway infra/helm/tradegateway/ \
            -f infra/helm/tradegateway/values.yaml \
            -f infra/helm/tradegateway/values-production.yaml \
            --set global.imageTag=${{ env.IMAGE_TAG }} \
            --namespace tradegateway \
            --create-namespace \
            --atomic \
            --timeout 15m \
            --wait
      - name: Notify Slack on deployment
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "TradeGateway™ NGSWTP ${{ github.ref_name }} deployed to production: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
