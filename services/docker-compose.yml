version: "3.9"

# ─── NGSWTP Microservices Stack ───────────────────────────────────────────────
# Full production-grade service orchestration
# Services: API Gateway, Risk Engine, Sanctions Screener, Rule Engine,
#           TigerBeetle Bridge, Kafka, Redis, PostgreSQL, Temporal, Dapr
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up risk-engine     # Start specific service
#   docker-compose logs -f            # Follow all logs
#   docker-compose down -v            # Stop and remove volumes

networks:
  ngswtp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  temporal-data:
  falkordb-data:
  neo4j-data:
  neo4j-logs:
  gnn-models:

# ─── SERVICES ─────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ngswtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradegateway
      POSTGRES_USER: tradegateway
      POSTGRES_PASSWORD: tradegateway_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ngswtp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ngswtp_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "ngswtp_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ngswtp-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ngswtp-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ngswtp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ngswtp-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ngswtp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - ngswtp-net

  # ── Temporal Workflow Engine ──────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: ngswtp-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=tradegateway
      - POSTGRES_PWD=tradegateway_secure_2026
      - POSTGRES_SEEDS=postgres
    networks:
      - ngswtp-net

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: ngswtp-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    networks:
      - ngswtp-net

  # ── Python Risk Engine ────────────────────────────────────────────────────────
  risk-engine:
    build:
      context: ./python/risk-engine
      dockerfile: Dockerfile
    container_name: ngswtp-risk-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      REDIS_URL: redis://:ngswtp_redis_2026@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RISK_ENGINE_PORT: "8090"
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Python Sanctions Screener ─────────────────────────────────────────────────
  sanctions-screener:
    build:
      context: ./python/sanctions-screener
      dockerfile: Dockerfile
    container_name: ngswtp-sanctions-screener
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      SANCTIONS_PORT: "8091"
      MATCH_THRESHOLD: "0.80"
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Rust Rule Engine ──────────────────────────────────────────────────────────
  rule-engine:
    build:
      context: ./rust/rule-engine
      dockerfile: Dockerfile
    container_name: ngswtp-rule-engine
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      RULE_ENGINE_PORT: "8092"
      RUST_LOG: "rule_engine=info"
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── TigerBeetle Bridge (canonical Go ledger service, HTTP /api/ledger/*) ──────
  # SW-O3: replaces the dev-only Rust bridge. Canonical port 8086.
  tigerbeetle-bridge:
    build:
      context: ./go/tigerbeetle-bridge
      dockerfile: Dockerfile
    container_name: ngswtp-tigerbeetle-bridge
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      TB_BRIDGE_HTTP_PORT: "8086"
      TIGERBEETLE_ADDR: ${TIGERBEETLE_ADDR:-tigerbeetle:3000}
      TB_ALLOW_SIM_BACKEND: ${TB_ALLOW_SIM_BACKEND:-}
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "/tigerbeetle-bridge", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Main Node.js/tRPC API Server ──────────────────────────────────────────────
  api-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ngswtp-api-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      REDIS_URL: redis://:ngswtp_redis_2026@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RISK_ENGINE_URL: http://risk-engine:8090
      SANCTIONS_SCREENER_URL: http://sanctions-screener:8091
      RULE_ENGINE_URL: http://rule-engine:8092
      TIGERBEETLE_BRIDGE_URL: http://tigerbeetle-bridge:8086
      TEMPORAL_ADDRESS: temporal:7233
    networks:
      - ngswtp-net

  # ── OpenSearch (Logs + Search) ────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: ngswtp-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
    ports:
      - "9200:9200"
    networks:
      - ngswtp-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: ngswtp-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - ngswtp-net

  # ── Prometheus + Grafana ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ngswtp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ngswtp-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ngswtp-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ngswtp_grafana_2026
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - ngswtp-net

  # ── Go Microservices ──────────────────────────────────────────────────────────
  declaration-service:
    build:
      context: ./go/declaration-service
      dockerfile: Dockerfile
    container_name: ngswtp-declaration-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      KAFKA_BROKERS: kafka:9092
      RISK_ENGINE_URL: http://risk-engine:8090
      RULE_ENGINE_URL: http://rule-engine:8092
      SANCTIONS_URL: http://sanctions-screener:8091
      OGA_SERVICE_ADDR: oga-service:9083
      GRPC_PORT: "9081"
      HTTP_PORT: "8081"
    networks:
      - ngswtp-net

  payment-service:
    build:
      context: ./go/payment-service
      dockerfile: Dockerfile
    container_name: ngswtp-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      KAFKA_BROKERS: kafka:9092
      TIGERBEETLE_URL: http://tigerbeetle-bridge:8086
      GRPC_PORT: "9082"
      HTTP_PORT: "8082"
    networks:
      - ngswtp-net

  oga-service:
    build:
      context: ./go/oga-service
      dockerfile: Dockerfile
    container_name: ngswtp-oga-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
      - "9083:9083"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      KAFKA_BROKERS: kafka:9092
      GRPC_PORT: "9083"
      HTTP_PORT: "8083"
    networks:
      - ngswtp-net

  profile-service:
    build:
      context: ./go/profile-service
      dockerfile: Dockerfile
    container_name: ngswtp-profile-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
      - "9084:9084"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      GRPC_PORT: "9084"
      HTTP_PORT: "8084"
    networks:
      - ngswtp-net

  mojaloop-gateway:
    build:
      context: ./go/mojaloop-gateway
      dockerfile: Dockerfile
    container_name: ngswtp-mojaloop-gateway
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8085"
    environment:
      KAFKA_BROKERS: kafka:9092
      HTTP_PORT: "8085"
    networks:
      - ngswtp-net

  # ── Python AI/ML Services ─────────────────────────────────────────────────────
  kyc-service:
    build:
      context: ./python/kyc-service
      dockerfile: Dockerfile
    container_name: ngswtp-kyc-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8095:8095"
    environment:
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      PORT: "8095"
    networks:
      - ngswtp-net

  # NOTE: the legacy services/python/vision-service (Ultralytics YOLOv8, AGPL-3.0)
  # was REMOVED for license compliance (phase-10 audit remediation). The deployed
  # vision service is microservices/vision-service (YOLOX-s ONNX, Apache-2.0),
  # built by the root docker-compose.yml.

  ollama-proxy:
    build:
      context: ./python/ollama-proxy
      dockerfile: Dockerfile
    container_name: ngswtp-ollama-proxy
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      PORT: "8097"
    networks:
      - ngswtp-net

  # ── FalkorDB (in-memory property graph — real-time risk scoring) ──────────────
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ngswtp-falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"   # graph queries (Redis protocol, offset to avoid clash with Redis)
      - "3002:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/data
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j (persistent graph analytics + GNN training data) ───────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: ngswtp-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      NEO4J_AUTH: neo4j/ngswtp_neo4j_2026
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Rust Graph-Risk Engine (GNN propagation, high-perf traversal) ─────────────
  rust-graph-risk:
    build:
      context: ./rust-graph-risk
      dockerfile: Dockerfile
    container_name: ngswtp-rust-graph-risk
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      PORT: "8098"
      RUST_LOG: "info"
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8098/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Python AI Service (GNN trainer, CocoIndex, EPR-KGQA, ART, Ollama bridge) ──
  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: ngswtp-python-ai
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8099:8099"
    volumes:
      - gnn-models:/app/models
    environment:
      PORT: "8099"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ngswtp_neo4j_2026
      OLLAMA_URL: http://ollama-proxy:8097
      DATABASE_URL: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8099/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Go Graph Bridge (orchestrates Rust engine + Python AI) ───────────────────
  go-graph-bridge:
    build:
      context: ./go-graph-bridge
      dockerfile: Dockerfile
    container_name: ngswtp-go-graph-bridge
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      PORT: "8100"
      FALKORDB_URL: redis://falkordb:6379
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ngswtp_neo4j_2026
      RUST_ENGINE_URL: http://rust-graph-risk:8098
      PYTHON_AI_URL: http://python-ai:8099
    networks:
      - ngswtp-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8100/health"]
      interval: 15s
      timeout: 5s
      retries: 5
