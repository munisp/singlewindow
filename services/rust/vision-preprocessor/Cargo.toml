[package]
name = "vision-preprocessor"
version = "0.1.0"
edition = "2021"
description = "High-performance image/video pre-processing pipeline for TradeGateway NGSWTP cargo vision analysis"

[[bin]]
name = "vision-preprocessor"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Image processing (pure Rust, no C deps)
image = { version = "0.25", features = ["jpeg", "png", "webp", "tiff", "bmp"] }
imageproc = "0.25"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for forwarding to Python vision service)
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Base64
base64 = "0.22"

# Metrics
prometheus = "0.13"

# Config
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
