[package]
name = "tigerbeetle-bridge"
version = "0.1.0"
edition = "2021"
description = "TigerBeetle financial ledger bridge — double-entry bookkeeping for customs duties"

[[bin]]
name = "tigerbeetle-bridge"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (PostgreSQL for ledger metadata — TigerBeetle for actual ledger)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
rust_decimal = { version = "1", features = ["serde-with-str"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
