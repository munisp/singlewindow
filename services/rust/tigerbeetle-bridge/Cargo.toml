[package]
name = "tigerbeetle-bridge"
version = "0.1.0"
edition = "2021"
description = "TigerBeetle financial ledger bridge — double-entry bookkeeping for customs duties"

[[bin]]
name = "tigerbeetle-bridge"
path = "src/main.rs"

# ─── Feature flags ─────────────────────────────────────────────────────────────
# Default: in-memory simulation (no TigerBeetle binary required)
# Production: cargo build --release --features tigerbeetle-live
# See PRODUCTION-GUIDE.md for full setup instructions.
[features]
default = []
tigerbeetle-live = ["dep:tigerbeetle"]

[dependencies]
# HTTP server
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (PostgreSQL for ledger metadata — TigerBeetle for actual ledger)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
rust_decimal = { version = "1", features = ["serde-with-str"] }

# TigerBeetle client — optional, enabled by the tigerbeetle-live feature flag.
# Requires the TigerBeetle binary to be installed on the build host.
# See PRODUCTION-GUIDE.md for setup instructions.
tigerbeetle = { version = "0.16", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
