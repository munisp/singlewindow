[package]
name = "hs-classifier"
version = "0.1.0"
edition = "2021"
description = "Harmonised System (HS) code classifier microservice — validates and classifies HS codes using WCO chapter lookup table"
authors = ["TradeGateway Team"]

[[bin]]
name = "hs-classifier"
path = "src/main.rs"

[dependencies]
tokio       = { workspace = true }
axum        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
metrics     = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tower-http  = { version = "0.5", features = ["cors", "trace"] }
once_cell   = "1"
regex       = "1"
