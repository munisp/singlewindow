[package]
name = "tigerbeetle-bridge"
version = "0.1.0"
edition = "2021"
description = "TradeGateway NGSWTP — TigerBeetle gRPC bridge service"

[[bin]]
name = "tigerbeetle-bridge"
path = "src/main.rs"

[dependencies]
# gRPC
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
prost-types = "0.13"

# TigerBeetle client
tigerbeetle-unofficial = "0.16"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"
prometheus-hyper = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"

# HTTP for health endpoint
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
