# ─────────────────────────────────────────────────────────────────────────────
# rustfs-svc — Go Storage Microservice Kubernetes Manifest
# This is the Go HTTP bridge between the tRPC backend and RustFS.
# Build the image from: rustfs-svc/main.go
#
# ClamAV sidecar: runs clamd daemon in the same Pod so rustfs-svc can call
# `clamscan` for pre-upload virus scanning. The virus DB is stored in a shared
# emptyDir volume and updated daily by the freshclam container.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-svc-config
  namespace: tradegateway-storage
data:
  RUSTFS_ENDPOINT: "http://rustfs.tradegateway-storage.svc.cluster.local:9000"
  RUSTFS_BUCKET: "tradegateway-docs"
  RUSTFS_USE_PATH_STYLE: "true"
  PORT: "4500"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-config
  namespace: tradegateway-storage
data:
  clamd.conf: |
    LogFile /var/log/clamav/clamd.log
    LogTime yes
    LogVerbose no
    PidFile /run/clamav/clamd.pid
    DatabaseDirectory /var/lib/clamav
    LocalSocket /run/clamav/clamd.ctl
    TCPSocket 3310
    TCPAddr 127.0.0.1
    MaxConnectionQueueLength 30
    MaxThreads 12
    ReadTimeout 300
    MaxDirectoryRecursion 15
    FollowDirectorySymlinks false
    FollowFileSymlinks false
    DetectPUA yes
    ScanPE yes
    ScanELF yes
    ScanOLE2 yes
    ScanPDF yes
    ScanHTML yes
    ScanArchive yes
    MaxScanSize 100M
    MaxFileSize 25M
    MaxRecursion 16
    MaxFiles 10000
    Bytecode yes
  freshclam.conf: |
    DatabaseDirectory /var/lib/clamav
    UpdateLogFile /var/log/clamav/freshclam.log
    LogTime yes
    LogVerbose no
    DatabaseMirror database.clamav.net
    Checks 24
    NotifyClamd /etc/clamav/clamd.conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-svc
  namespace: tradegateway-storage
  labels:
    app.kubernetes.io/name: rustfs-svc
    app.kubernetes.io/component: storage-gateway
    app.kubernetes.io/part-of: tradegateway-ngswtp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-svc
        app.kubernetes.io/component: storage-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4500"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: false   # ClamAV requires root for socket creation
        fsGroup: 1000
      # ── Init container: wait for ClamAV DB to be ready before starting main app
      initContainers:
        - name: wait-for-clamav-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for ClamAV virus database..."
              until [ -f /var/lib/clamav/main.cvd ] || [ -f /var/lib/clamav/main.cld ]; do
                echo "ClamAV DB not ready, sleeping 10s..."
                sleep 10
              done
              echo "ClamAV DB ready."
          volumeMounts:
            - name: clamav-db
              mountPath: /var/lib/clamav
      containers:
        # ── Main: rustfs-svc Go microservice ─────────────────────────────────
        - name: rustfs-svc
          # Build this image from rustfs-svc/main.go:
          #   docker build -t registry.tradegateway.gov/rustfs-svc:latest ./rustfs-svc
          image: registry.tradegateway.gov/rustfs-svc:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: rustfs-svc-config
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secret-key
          ports:
            - name: http
              containerPort: 4500
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 4500
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4500
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        # ── Sidecar: ClamAV daemon (clamd) ────────────────────────────────────
        # Provides TCP socket on 127.0.0.1:3310 for virus scanning.
        # rustfs-svc calls `clamscan --no-summary -` which uses the installed
        # clamscan binary (not the daemon socket directly) for simplicity.
        - name: clamd
          image: clamav/clamav:1.3
          imagePullPolicy: IfNotPresent
          command:
            - clamd
            - --foreground
            - --config-file=/etc/clamav/clamd.conf
          ports:
            - name: clamd-tcp
              containerPort: 3310
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 3310
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - clamdscan
                - --no-summary
                - --config-file=/etc/clamav/clamd.conf
                - /dev/null
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: clamav-db
              mountPath: /var/lib/clamav
            - name: clamav-config-vol
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
            - name: clamav-run
              mountPath: /run/clamav
            - name: clamav-log
              mountPath: /var/log/clamav

        # ── Sidecar: freshclam (daily virus DB updater) ───────────────────────
        # Runs as a long-lived process that checks for DB updates every hour.
        # On first start it downloads the full DB (~300 MB); subsequent runs
        # are incremental (CVD diffs, typically < 5 MB).
        - name: freshclam
          image: clamav/clamav:1.3
          imagePullPolicy: IfNotPresent
          command:
            - freshclam
            - --foreground
            - --config-file=/etc/clamav/freshclam.conf
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          volumeMounts:
            - name: clamav-db
              mountPath: /var/lib/clamav
            - name: clamav-config-vol
              mountPath: /etc/clamav/freshclam.conf
              subPath: freshclam.conf
            - name: clamav-log
              mountPath: /var/log/clamav

      volumes:
        - name: clamav-db
          # Use a PVC in production for DB persistence across Pod restarts.
          # Replace with persistentVolumeClaim if you want to avoid re-downloading
          # the full DB on every Pod restart.
          emptyDir:
            sizeLimit: 1Gi
        - name: clamav-config-vol
          configMap:
            name: clamav-config
        - name: clamav-run
          emptyDir: {}
        - name: clamav-log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-svc
  namespace: tradegateway-storage
  labels:
    app.kubernetes.io/name: rustfs-svc
spec:
  type: ClusterIP
  ports:
    - port: 4500
      targetPort: 4500
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: rustfs-svc
---
# ── Optional: PVC for ClamAV virus DB persistence ────────────────────────────
# Uncomment this and update the Deployment's clamav-db volume to use it
# instead of emptyDir to avoid re-downloading the full DB on Pod restarts.
#
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: clamav-db-pvc
#   namespace: tradegateway-storage
# spec:
#   accessModes:
#     - ReadWriteOnce
#   storageClassName: standard
#   resources:
#     requests:
#       storage: 1Gi
