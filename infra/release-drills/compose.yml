services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DRILL_DATABASE_NAME:-tradegateway_drill}
      POSTGRES_USER: drill_user
      POSTGRES_PASSWORD: drill_password
    ports:
      - "127.0.0.1:${DRILL_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill_user -d ${DRILL_DATABASE_NAME:-tradegateway_drill}"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    networks: [drill]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${DRILL_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [drill]

  toxiproxy:
    image: shopify/toxiproxy:2.5.0
    ports:
      - "127.0.0.1:${DRILL_TOXIPROXY_API_PORT:-18474}:8474"
      - "127.0.0.1:${DRILL_REDIS_PROXY_A_PORT:-26379}:16379"
      - "127.0.0.1:${DRILL_REDIS_PROXY_B_PORT:-26380}:16380"
    depends_on:
      redis:
        condition: service_healthy
    networks: [drill]

  runner-lifecycle-collector:
    build:
      context: ../monitoring/runner-lifecycle-collector
      dockerfile: Dockerfile
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 9090
      LIFECYCLE_EVENT_TOKEN: ${DRILL_COLLECTOR_TOKEN:-drill-token}
    ports:
      - "127.0.0.1:${DRILL_COLLECTOR_PORT:-19090}:9090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [drill]

networks:
  drill:
    name: ${DRILL_PROJECT:?DRILL_PROJECT must be set}_network
