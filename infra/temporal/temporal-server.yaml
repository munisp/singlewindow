# Temporal Server Deployment for TradeGateway NGSWTP
# Deploys Temporal with PostgreSQL persistence and Elasticsearch visibility
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: tradegateway
  labels:
    app: temporal-server
    component: workflow-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "temporal-server"
        dapr.io/app-port: "7233"
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.24.2
          ports:
            - containerPort: 7233  # gRPC frontend
            - containerPort: 7234  # gRPC history
            - containerPort: 7235  # gRPC matching
            - containerPort: 7239  # gRPC worker
            - containerPort: 8233  # HTTP frontend
          env:
            - name: DB
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: password
            - name: POSTGRES_SEEDS
              value: "postgresql.tradegateway.svc.cluster.local"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/dynamic_config/dynamic_config.yaml
            - name: ENABLE_ES
              value: "true"
            - name: ES_SEEDS
              value: "opensearch.tradegateway.svc.cluster.local"
            - name: ES_PORT
              value: "9200"
            - name: ES_VERSION
              value: v7
            - name: ES_SCHEME
              value: http
            - name: ES_VIS_INDEX
              value: temporal_visibility_v1_dev
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/temporal/dynamic_config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: dynamic-config
          configMap:
            name: temporal-dynamic-config
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: tradegateway
spec:
  selector:
    app: temporal-server
  ports:
    - name: grpc-frontend
      port: 7233
      targetPort: 7233
    - name: http-frontend
      port: 8233
      targetPort: 8233
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamic-config
  namespace: tradegateway
data:
  dynamic_config.yaml: |
    # Temporal dynamic configuration for TradeGateway
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
    limit.maxIDLength:
      - value: 255
    frontend.enableClientVersionCheck:
      - value: true
    history.defaultActivityRetryPolicy:
      - value:
          initialInterval: 1s
          backoffCoefficient: 2.0
          maximumInterval: 100s
          maximumAttempts: 3
    history.defaultWorkflowRetryPolicy:
      - value:
          initialInterval: 1s
          backoffCoefficient: 2.0
          maximumInterval: 100s
          maximumAttempts: 0
