    tier: backend
    language: rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tigerbeetle-bridge
  template:
    metadata:
      labels:
        app: tigerbeetle-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        dapr.io/enabled: "true"
        dapr.io/app-id: "tigerbeetle-bridge"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: tigerbeetle-bridge
          image: tradegateway/tigerbeetle-bridge:latest
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: tradegateway-config
            - secretRef:
                name: tradegateway-secrets
          env:
            - name: SERVICE_NAME
              value: "tigerbeetle-bridge"
            - name: RUST_LOG
              value: "info"
            - name: TIGERBEETLE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: tigerbeetle-address
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle-bridge
  namespace: tradegateway
spec:
  selector:
    app: tigerbeetle-bridge
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# ─── Vision Preprocessor (Rust) ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-preprocessor
  namespace: tradegateway
  labels:
    app: vision-preprocessor
    tier: backend
    language: rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vision-preprocessor
  template:
    metadata:
      labels:
        app: vision-preprocessor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        dapr.io/enabled: "true"
        dapr.io/app-id: "vision-preprocessor"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: vision-preprocessor
          image: tradegateway/vision-preprocessor:latest
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: tradegateway-config
            - secretRef:
                name: tradegateway-secrets
          env:
            - name: SERVICE_NAME
              value: "vision-preprocessor"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vision-preprocessor
  namespace: tradegateway
spec:
  selector:
    app: vision-preprocessor
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# ─── Persistent Volume Claim for ML Models ────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: tradegateway
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 50Gi
