# ─── risk-engine ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: tradegateway
  labels:
    app: risk-engine
    tier: ai
    language: python
spec:
  replicas: 3
  selector:
    matchLabels:
      app: risk-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: risk-engine
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9087"
        prometheus.io/path: "/metrics"
        dapr.io/enabled: "true"
        dapr.io/app-id: "risk-engine"
        dapr.io/app-port: "8087"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: model-loader
          image: tradegateway/risk-engine:latest
          command: ["python3", "-c", "import os; print('Models ready' if os.path.exists('/app/models') else 'No models')"]
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
      containers:
        - name: risk-engine
          image: tradegateway/risk-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
            - name: metrics
              containerPort: 9087
          env:
            - name: PORT
              value: "8087"
            - name: METRICS_PORT
              value: "9087"
            - name: ENVIRONMENT
              value: "production"
            - name: MODEL_PATH
              value: "/app/models"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: database-url
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: kafka-brokers
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: redis-url
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
          livenessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8087
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: tradegateway
  labels:
    app: risk-engine
spec:
  selector:
    app: risk-engine
  ports:
    - name: http
      port: 8087
      targetPort: 8087
    - name: metrics
      port: 9087
      targetPort: 9087
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: risk-engine-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: risk-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: risk-engine-pdb
  namespace: tradegateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: risk-engine
---

