# =============================================================================
# TradeGateway™ NGSWTP — Kubernetes Deployments: Core Go Microservices
# =============================================================================
# Covers: declaration-service, oga-service, profile-service, temporal-worker,
#         mojaloop-gateway, cargo-tracking-service, analytics-service,
#         workflow-service, temporal-query-service, fluvio-consumer
# =============================================================================

# ─── declaration-service ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: declaration-service
  namespace: tradegateway
  labels:
    app: declaration-service
    tier: backend
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: declaration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: declaration-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9083"
        prometheus.io/path: "/metrics"
        dapr.io/enabled: "true"
        dapr.io/app-id: "declaration-service"
        dapr.io/app-port: "8083"
        dapr.io/log-level: "info"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: declaration-service
          image: tradegateway/declaration-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
            - name: metrics
              containerPort: 9083
          env:
            - name: PORT
              value: "8083"
            - name: METRICS_PORT
              value: "9083"
            - name: ENVIRONMENT
              value: "production"
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: temporal-address
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: keycloak-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: database-url
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: kafka-brokers
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: redis-url
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: declaration-service
  namespace: tradegateway
  labels:
    app: declaration-service
spec:
  selector:
    app: declaration-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: metrics
      port: 9083
      targetPort: 9083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: declaration-service-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: declaration-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: declaration-service-pdb
  namespace: tradegateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: declaration-service
---

