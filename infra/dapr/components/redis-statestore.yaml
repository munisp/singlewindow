apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: tradegateway
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.tradegateway.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-credentials
        key: password
    - name: enableTLS
      value: "true"
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "2s"
    # Actor state TTL
    - name: ttlInSeconds
      value: "86400"  # 24 hours
    # Concurrency: last-write-wins for most state, first-write-wins for idempotent ops
    - name: concurrency
      value: "last-write"
    - name: consistency
      value: "strong"
auth:
  secretStore: kubernetes
scopes:
  - declaration-service
  - payment-service
  - oga-service
  - profile-service
  - risk-engine
