---
# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: tradegateway-ngswtp
    environment: production

---
# ─── ConfigMap: alertmanager.yml ──────────────────────────────────────────────
# The actual config is loaded from the file on disk (mounted via ConfigMap).
# Credentials are mounted separately via SealedSecret → Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
data:
  alertmanager.yml: |
    # Config loaded from infra/monitoring/alertmanager/alertmanager-config.yaml
    # This ConfigMap is generated by CI/CD from the source file.
    # See: .github/workflows/ci.yml → deploy-monitoring job
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.tradegateway.gov:587"
      smtp_from: "alerts@tradegateway.gov"
      smtp_auth_username: "alerts@tradegateway.gov"
      smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
    route:
      receiver: "slack-ops-general"
      group_by: ["alertname", "service", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [severity = "critical"]
          receiver: "pagerduty-critical"
          continue: true
        - matchers: [severity = "critical"]
          receiver: "slack-ops-critical"
          group_wait: 10s
          repeat_interval: 1h
        - matchers: [service =~ "payment|mojaloop|tigerbeetle|ledger"]
          receiver: "pagerduty-financial"
          continue: true
        - matchers: [service =~ "payment|mojaloop|tigerbeetle|ledger"]
          receiver: "slack-finance"
        - matchers: [service =~ "wazuh|soc|threat-intel|cen|sanctions"]
          receiver: "pagerduty-security"
          continue: true
        - matchers: [service =~ "wazuh|soc|threat-intel|cen|sanctions"]
          receiver: "slack-security"
        - matchers: [service =~ "declaration|oga|clearance|risk"]
          receiver: "slack-customs-ops"
        - matchers: [service =~ "kafka|temporal|redis|kubernetes|node"]
          receiver: "slack-devops"
        - matchers: [severity = "warning"]
          receiver: "slack-ops-general"
    receivers:
      - name: "slack-ops-general"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_ops
            channel: "#ops-alerts"
            send_resolved: true
            title: '{{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            color: '{{ if eq .Status "firing" }}{{ if eq (index .Alerts 0).Labels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
      - name: "slack-ops-critical"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_ops
            channel: "#ops-critical"
            send_resolved: true
            title: '🚨 CRITICAL: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
            color: "danger"
      - name: "slack-finance"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_finance
            channel: "#finance-alerts"
            send_resolved: true
            title: '💰 Finance Alert: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
      - name: "slack-security"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_security
            channel: "#security-alerts"
            send_resolved: true
            title: '🔐 Security Alert: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
      - name: "slack-customs-ops"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_ops
            channel: "#customs-ops"
            send_resolved: true
            title: '📋 Customs Alert: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
      - name: "slack-devops"
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_ops
            channel: "#devops-alerts"
            send_resolved: true
            title: '⚙️ Infrastructure Alert: {{ template "slack.title" . }}'
            text: '{{ template "slack.text" . }}'
      - name: "pagerduty-critical"
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty_critical_key
            severity: '{{ .CommonLabels.severity }}'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              service: '{{ .CommonLabels.service }}'
              environment: production
              runbook: '{{ .CommonAnnotations.runbook_url }}'
      - name: "pagerduty-financial"
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty_financial_key
            severity: '{{ .CommonLabels.severity }}'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              service: '{{ .CommonLabels.service }}'
              environment: production
      - name: "pagerduty-security"
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty_security_key
            severity: '{{ .CommonLabels.severity }}'
            description: '{{ .CommonAnnotations.summary }}'
            details:
              service: '{{ .CommonLabels.service }}'
              environment: production
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: ["alertname", "service"]
      - source_matchers: [alertname = "KubernetesClusterDown"]
        target_matchers: [severity =~ "critical|warning"]
    templates:
      - /etc/alertmanager/templates/*.tmpl

---
# ─── SealedSecret: alertmanager-credentials ───────────────────────────────────
# This is a TEMPLATE — seal with: kubeseal --format yaml < secret-plain.yaml > sealed.yaml
# The sealed values below are PLACEHOLDERS. Replace with actual kubeseal output.
# Plain secret structure (DO NOT COMMIT):
#   pagerduty_critical_key:  <PagerDuty Events API v2 integration key for critical service>
#   pagerduty_financial_key: <PagerDuty Events API v2 integration key for financial service>
#   pagerduty_security_key:  <PagerDuty Events API v2 integration key for security service>
#   slack_webhook_ops:       <Slack Incoming Webhook URL for #ops-alerts>
#   slack_webhook_finance:   <Slack Incoming Webhook URL for #finance-alerts>
#   slack_webhook_security:  <Slack Incoming Webhook URL for #security-alerts>
#   smtp_password:           <SMTP password for alerts@tradegateway.gov>
#
# To generate:
#   kubectl create secret generic alertmanager-credentials \
#     --namespace=monitoring \
#     --from-literal=pagerduty_critical_key=<KEY> \
#     --from-literal=pagerduty_financial_key=<KEY> \
#     --from-literal=pagerduty_security_key=<KEY> \
#     --from-literal=slack_webhook_ops=https://hooks.slack.com/services/... \
#     --from-literal=slack_webhook_finance=https://hooks.slack.com/services/... \
#     --from-literal=slack_webhook_security=https://hooks.slack.com/services/... \
#     --from-literal=smtp_password=<PASSWORD> \
#     --dry-run=client -o yaml | \
#   kubeseal --controller-namespace=kube-system --format yaml > \
#     infra/k8s/secrets/alertmanager-credentials-sealed.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-credentials
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    pagerduty_critical_key: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
    pagerduty_financial_key: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
    pagerduty_security_key: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
    slack_webhook_ops: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
    slack_webhook_finance: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
    slack_webhook_security: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
    smtp_password: "SEALED_PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT"
  template:
    metadata:
      name: alertmanager-credentials
      namespace: monitoring
    type: Opaque

---
# ─── ServiceAccount ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/version: "0.27.0"
    app.kubernetes.io/part-of: tradegateway-ngswtp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/version: "0.27.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
        # Force rolling restart when config changes
        checksum/config: "{{ include (print $.Template.BasePath \"/alertmanager-configmap.yaml\") . | sha256sum }}"
    spec:
      serviceAccountName: alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=https://alertmanager.tradegateway.gov"
            - "--cluster.listen-address=0.0.0.0:9094"
            - "--cluster.peer=alertmanager-0.alertmanager:9094"
            - "--cluster.peer=alertmanager-1.alertmanager:9094"
            - "--log.level=info"
            - "--log.format=json"
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
            - name: cluster
              containerPort: 9094
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: credentials
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: templates
              mountPath: /etc/alertmanager/templates
              readOnly: true
            - name: storage
              mountPath: /alertmanager
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: credentials
          secret:
            secretName: alertmanager-credentials
            defaultMode: 0400
        - name: templates
          configMap:
            name: alertmanager-templates
        - name: storage
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alertmanager
                topologyKey: kubernetes.io/hostname

---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP
    - name: cluster
      port: 9094
      targetPort: cluster
      protocol: TCP
  selector:
    app: alertmanager

---
# ─── ConfigMap: Slack templates ───────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
data:
  slack.tmpl: |
    {{ define "slack.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
    {{ .CommonLabels.alertname }} — {{ .CommonLabels.service }}
    {{ end }}

    {{ define "slack.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Annotations.summary }}
    *Description:* {{ .Annotations.description }}
    *Service:* {{ .Labels.service }}
    *Severity:* {{ .Labels.severity }}
    *Environment:* production
    {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>{{ end }}
    *Started:* {{ .StartsAt | since }}
    {{ end }}
    {{ end }}

---
# ─── PodDisruptionBudget ──────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager-pdb
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: alertmanager

---
# ─── HorizontalPodAutoscaler ──────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alertmanager-hpa
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alertmanager
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ─── NetworkPolicy: Alertmanager ─────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-netpol
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: tradegateway-ngswtp
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus to send alerts
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9093
    # Allow Grafana to query Alertmanager
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 9093
    # Allow cluster peering between Alertmanager replicas
    - from:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 9094
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS to PagerDuty and Slack
    - ports:
        - port: 443
          protocol: TCP
    # Allow SMTP
    - ports:
        - port: 587
          protocol: TCP
    # Allow cluster peering
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 9094
