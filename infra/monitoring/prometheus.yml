global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tradegateway-ngswtp
    environment: development

# Production deployments should mount the runner alert file at this path.
rule_files:
  - /etc/prometheus/rules/ephemeral-runner-alerts.yaml

scrape_configs:
  - job_name: apisix
    static_configs:
      - targets: ["apisix:9091"]
    metrics_path: /apisix/prometheus/metrics

  - job_name: declaration-service
    static_configs:
      - targets: ["host.docker.internal:8081"]
    metrics_path: /metrics

  - job_name: oga-service
    static_configs:
      - targets: ["host.docker.internal:8082"]
    metrics_path: /metrics

  - job_name: payment-service
    static_configs:
      - targets: ["host.docker.internal:8083"]
    metrics_path: /metrics

  - job_name: profile-service
    static_configs:
      - targets: ["host.docker.internal:8084"]
    metrics_path: /metrics

  - job_name: risk-engine
    static_configs:
      - targets: ["host.docker.internal:8085"]
    metrics_path: /metrics

  - job_name: sanctions-screener
    static_configs:
      - targets: ["host.docker.internal:8086"]
    metrics_path: /metrics

  - job_name: rule-engine
    static_configs:
      - targets: ["host.docker.internal:8087"]
    metrics_path: /metrics

  - job_name: ledger-bridge
    static_configs:
      - targets: ["host.docker.internal:8088"]
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]

  # notification-dispatcher admin metrics (Go service, port 8081)
  # Exposes: total_cycles, total_validated, total_stale, total_purged, last_cycle_at_ms
  - job_name: notification-dispatcher
    static_configs:
      - targets: ["notification-dispatcher:8081"]
    metrics_path: /admin/metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: notification-dispatcher
      - target_label: component
        replacement: token-refresher

  # anomaly-detection-svc Prometheus metrics (Python FastAPI, port 8000)
  # Exposes: total_analysed, total_alerts, blocked_count, alerts_by_rule
  - job_name: anomaly-detection-svc
    static_configs:
      - targets: ["anomaly-detection-svc:8000"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: anomaly-detection-svc
      - target_label: component
        replacement: anomaly-detector

  # hs-classifier Rust microservice (port 8090)
  # Exposes: hs_classifications_total, hs_valid_total, hs_invalid_total
  - job_name: hs-classifier
    static_configs:
      - targets: ["hs-classifier:8090"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - target_label: service
        replacement: hs-classifier
      - target_label: component
        replacement: hs-code-validator
