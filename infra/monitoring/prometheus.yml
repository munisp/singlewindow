global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: tradegateway-ngswtp
    environment: development

scrape_configs:
  - job_name: apisix
    static_configs:
      - targets: ["apisix:9091"]
    metrics_path: /apisix/prometheus/metrics

  - job_name: declaration-service
    static_configs:
      - targets: ["host.docker.internal:8081"]
    metrics_path: /metrics

  - job_name: oga-service
    static_configs:
      - targets: ["host.docker.internal:8082"]
    metrics_path: /metrics

  - job_name: payment-service
    static_configs:
      - targets: ["host.docker.internal:8083"]
    metrics_path: /metrics

  - job_name: profile-service
    static_configs:
      - targets: ["host.docker.internal:8084"]
    metrics_path: /metrics

  - job_name: risk-engine
    static_configs:
      - targets: ["host.docker.internal:8085"]
    metrics_path: /metrics

  - job_name: sanctions-screener
    static_configs:
      - targets: ["host.docker.internal:8086"]
    metrics_path: /metrics

  - job_name: rule-engine
    static_configs:
      - targets: ["host.docker.internal:8087"]
    metrics_path: /metrics

  - job_name: ledger-bridge
    static_configs:
      - targets: ["host.docker.internal:8088"]
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]
