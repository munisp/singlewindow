# Fluent Bit alternative for dedicated runner hosts.
# Use this instead of Promtail on a host; do not tail the same journal with both.

[SERVICE]
    Flush                     1
    Grace                     30
    Log_Level                 info
    Parsers_File              parsers.conf
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          on
    storage.backlog.mem_limit 50M

[INPUT]
    Name              systemd
    Tag               singlewindow.runner.journal
    Systemd_Filter    _SYSTEMD_UNIT=docker.service
    DB                /var/lib/fluent-bit/state.db
    Read_From_Tail    On
    storage.type      filesystem

[FILTER]
    Name              parser
    Match             singlewindow.runner.journal
    Key_Name          MESSAGE
    Parser            runner_json
    Reserve_Data      On
    Preserve_Key      On

[FILTER]
    Name              modify
    Match             singlewindow.runner.journal
    Add               service github-actions-runner
    Add               environment production
    Add               platform tradegateway-ngswtp
    Add               log_class ci_lifecycle

# Redact common secret-bearing fields before the record leaves the host.
[FILTER]
    Name              lua
    Match             singlewindow.runner.journal
    script            redact.lua
    call              redact_secrets

[OUTPUT]
    Name              loki
    Match             singlewindow.runner.journal
    Host              loki.monitoring.example.com
    Port              443
    TLS               On
    URI               /loki/api/v1/push
    Tenant_ID         tradegateway
    Labels            job=github-actions-runner,service=$service,environment=$environment,runner_mode=$runner_mode,workflow=$workflow,level=$level,failure_class=$failure_class
    Line_Format       json
    Retry_Limit       False
