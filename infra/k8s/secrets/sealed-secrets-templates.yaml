# =============================================================================
# TradeGateway™ NGSWTP — Sealed Secret Templates
# =============================================================================
# These are PLACEHOLDER templates showing the structure.
# Replace encryptedData values with real sealed values from kubeseal.
# See README.md for sealing instructions.
# =============================================================================

---
# Database credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tradegateway-db-credentials
  namespace: tradegateway
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    DATABASE_URL: "<SEAL: mysql://user:pass@tidb-host:4000/tradegateway>"
  template:
    metadata:
      name: tradegateway-db-credentials
      namespace: tradegateway
    type: Opaque

---
# JWT secret
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tradegateway-jwt
  namespace: tradegateway
spec:
  encryptedData:
    JWT_SECRET: "<SEAL: 64-char-random-hex>"
  template:
    metadata:
      name: tradegateway-jwt
      namespace: tradegateway
    type: Opaque

---
# Redis credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tradegateway-redis
  namespace: tradegateway
spec:
  encryptedData:
    REDIS_URL: "<SEAL: redis://:password@redis-master.redis.svc.cluster.local:6379>"
    REDIS_PASSWORD: "<SEAL: redis-password>"
  template:
    metadata:
      name: tradegateway-redis
      namespace: tradegateway
    type: Opaque

---
# Kafka credentials (SASL/SCRAM-SHA-512)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tradegateway-kafka
  namespace: tradegateway
spec:
  encryptedData:
    KAFKA_BROKERS: "<SEAL: kafka-0.kafka-headless.kafka.svc.cluster.local:9092,...>"
    KAFKA_SASL_USERNAME: "<SEAL: tradegateway-producer>"
    KAFKA_SASL_PASSWORD: "<SEAL: kafka-sasl-password>"
    KAFKA_CA_CERT: "<SEAL: base64-encoded-ca-cert>"
  template:
    metadata:
      name: tradegateway-kafka
      namespace: tradegateway
    type: Opaque

