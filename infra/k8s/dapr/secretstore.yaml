# =============================================================================
# TradeGateway™ NGSWTP — Dapr Kubernetes Secret Store Component
# Allows all Dapr-enabled services to read Kubernetes Secrets via Dapr API
# instead of mounting volumes or using env vars directly.
# Deploy: kubectl apply -f infra/k8s/dapr/secretstore.yaml
# =============================================================================
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: tradegateway
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []
---
# =============================================================================
# Dapr pubsub Component — Kafka (production)
# Mirrors infra/dapr/components/kafka-pubsub.yaml but scoped to k8s/dapr/
# for GitOps apply ordering (secrets must exist before components)
# =============================================================================
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: tradegateway
  labels:
    app.kubernetes.io/part-of: tradegateway
    app.kubernetes.io/managed-by: kubectl
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      secretKeyRef:
        name: tradegateway-secrets
        key: kafka-brokers
    - name: consumerGroup
      value: "tradegateway-dapr"
    - name: authType
      value: "none"
    - name: initialOffset
      value: "newest"
    - name: maxMessageBytes
      value: "10485760"
    - name: consumeRetryInterval
      value: "200ms"
    - name: version
      value: "3.0.0"
auth:
  secretStore: kubernetes-secrets
---
# =============================================================================
# Dapr statestore Component — Redis
# =============================================================================
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: tradegateway
  labels:
    app.kubernetes.io/part-of: tradegateway
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      secretKeyRef:
        name: tradegateway-secrets
        key: redis-host
    - name: redisPassword
      secretKeyRef:
        name: tradegateway-secrets
        key: redis-password
    - name: enableTLS
      value: "true"
    - name: maxRetries
      value: "3"
    - name: maxRetryBackoff
      value: "2s"
    - name: ttlInSeconds
      value: "3600"
    - name: keyPrefix
      value: "tradegateway"
auth:
  secretStore: kubernetes-secrets
---
# =============================================================================
# Dapr Subscription — declaration.submitted
# Routes declaration.submitted events from Kafka to declaration-service
# =============================================================================
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: declaration-submitted-sub
  namespace: tradegateway
spec:
  topic: declaration.submitted
  routes:
    default: /dapr/subscribe/declaration-submitted
  pubsubname: pubsub
  deadLetterTopic: declaration.submitted.dlq
  bulkSubscribe:
    enabled: true
    maxMessagesCount: 100
    maxAwaitDurationMs: 40
scopes:
  - declaration-service
  - risk-engine
---
