  namespace: tradegateway
  labels:
    app: hs-classifier
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: hs-classifier
  namespaceSelector:
    matchNames:
      - tradegateway
  endpoints:
    - port: http           # named port "http" on the Service (8090)
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: service
          replacement: hs-classifier
        - targetLabel: component
          replacement: hs-code-validator
