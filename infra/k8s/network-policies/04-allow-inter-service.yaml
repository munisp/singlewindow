---
# ─── OGA Service ─────────────────────────────────────────────────────────────
# Receives calls from: declaration-service, temporal-worker, web-api
# Calls out to: notification-service, audit-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oga-service
  namespace: tradegateway
  labels:
    app.kubernetes.io/part-of: tradegateway
    security.tradegateway.gov/policy-type: service-mesh
spec:
  podSelector:
    matchLabels:
      app: oga-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: declaration-service
        - podSelector:
            matchLabels:
              app: temporal-worker
        - podSelector:
            matchLabels:
              app: tradegateway-web
      ports:
        - port: 8084
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 8089
    - to:
        - podSelector:
            matchLabels:
              app: audit-service
      ports:
        - port: 8096
