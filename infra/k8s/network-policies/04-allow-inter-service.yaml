---
# TradeGateway™ NGSWTP — Inter-Service Communication Policies
# Governs which microservices may communicate with each other.
# Principle: only explicitly permitted service-to-service calls are allowed.

# ─── Declaration Service ──────────────────────────────────────────────────────
# Receives calls from: web-api, temporal-worker
# Calls out to: risk-engine, oga-service, notification-service, audit-service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-declaration-service
  namespace: tradegateway
  labels:
    app.kubernetes.io/part-of: tradegateway
    security.tradegateway.gov/policy-type: service-mesh
spec:
  podSelector:
    matchLabels:
      app: declaration-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tradegateway-web
        - podSelector:
            matchLabels:
              app: temporal-worker
      ports:
        - port: 8083
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: risk-engine-service
      ports:
        - port: 8087
    - to:
        - podSelector:
            matchLabels:
              app: oga-service
      ports:
        - port: 8084
    - to:
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 8089
    - to:
        - podSelector:
            matchLabels:
              app: audit-service
      ports:
        - port: 8096
    - to:
        - podSelector:
            matchLabels:
              app: document-management-service
      ports:
        - port: 8097
---
