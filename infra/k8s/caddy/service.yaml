---
# ═══════════════════════════════════════════════════════════════════════════════
# TradeGateway NGSWTP — Caddy Service (LoadBalancer)
# Exposes ports 80 (HTTP), 443 TCP (HTTPS), 443 UDP (HTTP/3 QUIC)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: tradegateway
  labels:
    app: caddy
    component: edge-proxy
  annotations:
    # AWS NLB — preserve client IP
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # GCP — preserve client IP
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: https-quic
      port: 443
      targetPort: 443
      protocol: UDP
  externalTrafficPolicy: Local
---
# ── Caddy Admin API Service (ClusterIP — internal only) ───────────────────────
apiVersion: v1
kind: Service
metadata:
  name: caddy-admin
  namespace: tradegateway
  labels:
    app: caddy
    component: admin-api
spec:
  type: ClusterIP
  selector:
    app: caddy
  ports:
    - name: admin
      port: 2019
      targetPort: 2019
      protocol: TCP
---
# ═══════════════════════════════════════════════════════════════════════════════
# oauth2-proxy Deployment
# Bridges Caddy's forward_auth with Keycloak OIDC.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: tradegateway
  labels:
    app: oauth2-proxy
    component: auth-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: auth-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        fsGroup: 2000
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: caddy-secrets
                  key: keycloak-caddy-client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: caddy-secrets
                  key: oauth2-proxy-cookie-secret
          ports:
            - containerPort: 4180
              name: http
          volumeMounts:
            - name: oauth2-proxy-config
              mountPath: /etc/oauth2-proxy/oauth2-proxy.cfg
              subPath: oauth2-proxy.cfg
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: oauth2-proxy-config
          configMap:
            name: oauth2-proxy-config
---
# ── oauth2-proxy Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: tradegateway
  labels:
    app: oauth2-proxy
spec:
  type: ClusterIP
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
# ── oauth2-proxy ConfigMap ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: tradegateway
data:
  oauth2-proxy.cfg: |
    provider = "keycloak-oidc"
    oidc_issuer_url = "https://auth.tradegateway.gov.ng/realms/tradegateway"
    client_id = "caddy-frontend"
    upstreams = ["static://200"]
    cookie_name = "_tradegateway_session"
    cookie_secure = true
    cookie_httponly = true
    cookie_samesite = "lax"
    cookie_expire = "8h"
    cookie_refresh = "1h"
    cookie_domains = [".tradegateway.gov.ng"]
    session_store_type = "redis"
    redis_connection_url = "redis://:$(REDIS_PASSWORD)@redis.tradegateway.svc.cluster.local:6379"
    pass_access_token = true
    pass_user_headers = true
    set_xauthrequest = true
    scope = "openid profile email roles"
    email_domains = ["*"]
    redirect_url = "https://trader.tradegateway.gov.ng/oauth2/callback"
    http_address = "0.0.0.0:4180"
    request_logging = true
    auth_logging = true
---
# ── Caddy Secrets (populate via kubectl or external-secrets) ─────────────────
# kubectl create secret generic caddy-secrets \
#   --from-literal=acme-email=ops@tradegateway.gov.ng \
#   --from-literal=keycloak-caddy-client-secret=<secret> \
#   --from-literal=oauth2-proxy-cookie-secret=$(openssl rand -base64 32) \
#   -n tradegateway
apiVersion: v1
kind: Secret
metadata:
  name: caddy-secrets
  namespace: tradegateway
  annotations:
    # Replace with external-secrets or sealed-secrets in production
    kubernetes.io/description: "Caddy TLS and oauth2-proxy secrets — replace placeholder values"
type: Opaque
stringData:
  acme-email: "ops@tradegateway.gov.ng"
  keycloak-caddy-client-secret: "REPLACE_WITH_KEYCLOAK_CADDY_CLIENT_SECRET"
  oauth2-proxy-cookie-secret: "REPLACE_WITH_32_BYTE_BASE64_RANDOM_SECRET"
