---
# ═══════════════════════════════════════════════════════════════════════════════
# TradeGateway NGSWTP — Caddy IngressClass
#
# Registers Caddy as a named IngressClass so Kubernetes Ingress resources
# can target it with:  ingressClassName: caddy
#
# The Caddy Ingress Controller (github.com/caddyserver/ingress) watches
# Ingress resources and dynamically updates Caddy's configuration via
# the admin API at caddy-admin:2019.
#
# Install the Caddy Ingress Controller:
#   helm repo add caddy https://caddyserver.github.io/ingress/
#   helm install caddy-ingress caddy/caddy-ingress-controller \
#     --namespace tradegateway \
#     --set ingressController.config.onDemandTLS=true \
#     --set ingressController.config.email=ops@tradegateway.gov.ng
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: caddy
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: caddy.ingress.kubernetes.io/ingress-controller
---
