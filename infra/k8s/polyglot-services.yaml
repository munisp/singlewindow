        dapr.io/app-id: "risk-engine-go"
        dapr.io/app-port: "8080"
        dapr.io/config: "tradegateway-config"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: risk-engine-go
          image: tradegateway/risk-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
              name: grpc
            - containerPort: 8080
