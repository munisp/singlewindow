# ─────────────────────────────────────────────────────────────────────────────
# 5. TigerBeetle Bridge — Rust replica REMOVED (SW-O3)
# The Rust bridge replica was removed from deploy surfaces: its in-memory
# ledger is dev-only (TB_ALLOW_SIM_BACKEND=1). The canonical money-rail bridge
# is the Go service `tigerbeetle-bridge` (HTTP /api/ledger/*, port 8086) — see
# infra/kubernetes/deployments/ai-services.yaml.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# 6. Rust — Kafka Consumer (Domain Event Processor)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-rust
  namespace: tradegateway
  labels:
    app: kafka-consumer-rust
    language: rust
    tier: events
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kafka-consumer-rust
  template:
    metadata:
      labels:
        app: kafka-consumer-rust
        language: rust
        tier: events
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: kafka-consumer-rust
          image: tradegateway/kafka-consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: KAFKA_BROKERS
            - name: KAFKA_GROUP_ID
              value: "tradegateway-rust-consumer"
            - name: OPENSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: OPENSEARCH_URL
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-consumer-rust
  namespace: tradegateway
spec:
  selector:
    app: kafka-consumer-rust
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
# ─────────────────────────────────────────────────────────────────────────────
# 7. Python — AI Risk Scorer (FastAPI + XGBoost + Isolation Forest)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-risk-scorer
  namespace: tradegateway
  labels:
    app: ai-risk-scorer
    language: python
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-risk-scorer
  template:
    metadata:
      labels:
        app: ai-risk-scorer
        language: python
        tier: ml
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9096"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ai-risk-scorer
          image: tradegateway/ai-risk-scorer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
            - containerPort: 9096
              name: metrics
          env:
            - name: MODEL_PATH
              value: "/app/models"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: KAFKA_BROKERS
            - name: KAFKA_GROUP_ID
              value: "ai-risk-scorer"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: DATABASE_URL
            - name: RETRAIN_SCHEDULE
              value: "0 2 * * 0"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: ai-risk-scorer-models-pvc
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-risk-scorer
  namespace: tradegateway
spec:
  selector:
    app: ai-risk-scorer
  ports:
    - name: http
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 9096
      targetPort: 9096
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-risk-scorer-models-pvc
  namespace: tradegateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
