---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-indexer
  namespace: tradegateway
spec:
  selector:
    app: opensearch-indexer
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
# ─────────────────────────────────────────────────────────────────────────────
# HorizontalPodAutoscalers for all polyglot services
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: declaration-engine-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: declaration-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: risk-engine-go-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: risk-engine-go
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-risk-scorer-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-risk-scorer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap for polyglot service configuration
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tradegateway-config
  namespace: tradegateway
data:
  KAFKA_BROKERS: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"
  TIGERBEETLE_ADDRESS: "tigerbeetle-0.tigerbeetle-headless:3000"
  OPENSEARCH_URL: "https://opensearch-cluster-master:9200"
  TEMPORAL_ADDRESS: "temporal-frontend:7233"
  TEMPORAL_NAMESPACE: "tradegateway"
  AI_RISK_SCORER_URL: "http://ai-risk-scorer:8001"
  DECLARATION_ENGINE_URL: "http://declaration-engine:8080"
  RISK_ENGINE_GO_URL: "http://risk-engine-go:8080"
  OGA_HUB_URL: "http://oga-hub:8080"
  CARGO_TRACKING_GO_URL: "http://cargo-tracking-go:8080"
  TIGERBEETLE_BRIDGE_URL: "http://tigerbeetle-bridge:8086"
  KAFKA_CONSUMER_METRICS_URL: "http://kafka-consumer-rust:9090"
  OPENSEARCH_INDEXER_URL: "http://opensearch-indexer:8002"

---
# ─────────────────────────────────────────────────────────────────────────────
# Rust — HS Code Classifier (v75)
# POST /classify  — validate + classify HS codes (WCO chapter lookup)
# GET  /health    — liveness probe
# GET  /metrics   — Prometheus counters
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hs-classifier
  namespace: tradegateway
  labels:
    app: hs-classifier
    language: rust
    tier: intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hs-classifier
  template:
    metadata:
      labels:
        app: hs-classifier
        language: rust
        tier: intelligence
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "hs-classifier"
        dapr.io/app-port: "8090"
        dapr.io/config: "tradegateway-config"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: hs-classifier
          image: tradegateway/hs-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PORT
              value: "8090"
            - name: RUST_LOG
              value: "hs_classifier=info,tower_http=info"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hs-classifier
  namespace: tradegateway
  labels:
    app: hs-classifier
spec:
  selector:
    app: hs-classifier
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hs-classifier-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hs-classifier
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ── OpenAppSec Agent ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openappsec-agent
  namespace: tradegateway
  labels:
    app: openappsec-agent
    component: security
    tier: waf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openappsec-agent
  template:
    metadata:
      labels:
        app: openappsec-agent
        component: security
      annotations:
        dapr.io/enabled: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: openappsec-agent
          # P0-11 (PRA-104): mutable tags are FORBIDDEN on the WAF agent. Pin by
          # digest of the approved openappsec/agent release. This manifest
          # intentionally carries a placeholder digest: deploying without
          # substituting a real digest fails closed (the pod cannot start)
          # rather than silently running an unpinned/possibly tampered image.
          # Resolve at deploy time, e.g.:
          #   docker buildx imagetools inspect openappsec/agent:<approved-tag>
          image: openappsec/agent@sha256:REPLACE_WITH_APPROVED_OPENAPPSEC_AGENT_DIGEST
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: POLICY_FILE
              value: "/etc/openappsec/policy.json"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: policy-config
              mountPath: /etc/openappsec
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: policy-config
          configMap:
            name: openappsec-policy
---
apiVersion: v1
kind: Service
metadata:
  name: openappsec-agent
  namespace: tradegateway
spec:
  selector:
    app: openappsec-agent
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openappsec-policy
  namespace: tradegateway
data:
  policy.json: |
    {
      "policies": {
        "default": {
          "mode": "prevent-learn",
          "practices": [
            {
              "name": "tradegateway-waf",
              "type": "WebApplication",
              "web-attacks": {
                "minimum-confidence": "high",
                "max-body-size-kb": 1024,
                "max-header-size-bytes": 8192,
                "max-url-size-bytes": 4096
              }
            }
          ],
          "triggers": [
            {
              "name": "tradegateway-log",
              "type": "log",
              "prevent-events-logging": true
            }
          ]
        }
      }
    }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openappsec-agent-hpa
  namespace: tradegateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openappsec-agent
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
