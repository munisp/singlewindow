---
# ═══════════════════════════════════════════════════════════════════════════════
# TradeGateway NGSWTP — Polyglot Service Kubernetes Manifests
# Services: Go (×4), Rust (×2), Python (×2)
# All services use:
#   - Non-root UID 1001
#   - Read-only root filesystem
#   - Resource limits
#   - Liveness + readiness probes
#   - Dapr sidecar annotations
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# 1. Go — Declaration Engine
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: declaration-engine
  namespace: tradegateway
  labels:
    app: declaration-engine
    language: go
    tier: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: declaration-engine
  template:
    metadata:
      labels:
        app: declaration-engine
        language: go
        tier: core
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "declaration-engine"
        dapr.io/app-port: "8080"
        dapr.io/config: "tradegateway-config"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tradegateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: declaration-engine
          image: tradegateway/declaration-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: tradegateway-config
                  key: KAFKA_BROKERS
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tradegateway-secrets
                  key: REDIS_URL
            - name: GRPC_TLS_CERT_FILE
              value: /etc/tls/tls.crt
            - name: GRPC_TLS_KEY_FILE
              value: /etc/tls/tls.key
            - name: GRPC_TLS_CA_FILE
              value: /etc/tls/ca.crt
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls-certs
          secret:
            secretName: tradegateway-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: declaration-engine
  namespace: tradegateway
spec:
  selector:
    app: declaration-engine
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 8080
      targetPort: 8080
---
