                  name: tradegateway-config
                  key: KAFKA_BROKERS
            - name: AI_RISK_SCORER_URL
              value: "http://ai-risk-scorer:8001"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls-certs
          secret:
            secretName: tradegateway-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine-go
  namespace: tradegateway
spec:
  selector:
    app: risk-engine-go
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: http
      port: 8080
      targetPort: 8080
---
