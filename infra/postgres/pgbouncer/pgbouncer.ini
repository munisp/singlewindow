; =============================================================================
; TradeGateway™ NGSWTP — PgBouncer Production Configuration
; =============================================================================
; PgBouncer sits between all microservices and PostgreSQL, providing:
;   - Connection pooling (transaction mode) to handle 500+ concurrent connections
;   - Read/write splitting via separate pool entries
;   - Connection limits per database and user
;
; Deploy: kubectl apply -f infra/kubernetes/deployments/pgbouncer.yaml
; =============================================================================

[databases]
; Primary (read-write) — all microservices write here
tradegateway = host=postgres-primary.postgres.svc.cluster.local port=5432 dbname=tradegateway

; Read replica — analytics, reporting, audit log queries
tradegateway_ro = host=postgres-replica.postgres.svc.cluster.local port=5432 dbname=tradegateway

; Temporal backend database
temporal = host=postgres-primary.postgres.svc.cluster.local port=5432 dbname=temporal

[pgbouncer]
; ─── Mode ─────────────────────────────────────────────────────────────────────
; transaction mode: connection returned to pool after each transaction
; ideal for short-lived microservice connections
pool_mode = transaction

; ─── Listen ───────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =

; ─── Authentication ───────────────────────────────────────────────────────────
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Use auth_query for dynamic user lookup (requires pg_shadow access)
; auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

; ─── Pool Sizes ───────────────────────────────────────────────────────────────
; Max server connections per pool (database+user pair)
default_pool_size = 25

; Max connections PgBouncer will open to PostgreSQL
max_client_conn = 1000

; Reserve pool for burst traffic
reserve_pool_size = 10
reserve_pool_timeout = 3

; Per-database limits
max_db_connections = 100
max_user_connections = 100

; ─── Timeouts ─────────────────────────────────────────────────────────────────
; Seconds to wait for a server connection
server_connect_timeout = 5

; Seconds to wait for a client query
client_login_timeout = 10

; Idle server connection lifetime (seconds)
server_idle_timeout = 600

; Idle client connection lifetime (seconds)
client_idle_timeout = 0  ; disabled — clients manage their own timeouts

; ─── TLS ──────────────────────────────────────────────────────────────────────
; Require TLS for all client connections
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/tls/tls.crt
client_tls_key_file  = /etc/pgbouncer/tls/tls.key
client_tls_ca_file   = /etc/pgbouncer/tls/ca.crt

; Require TLS to PostgreSQL
server_tls_sslmode = require
server_tls_ca_file = /etc/pgbouncer/tls/ca.crt

; ─── Logging ──────────────────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ─── Admin ────────────────────────────────────────────────────────────────────
admin_users = pgbouncer_admin
stats_users = pgbouncer_monitor

; ─── Ignore startup parameters ────────────────────────────────────────────────
; Required for Drizzle ORM compatibility
ignore_startup_parameters = extra_float_digits,options
