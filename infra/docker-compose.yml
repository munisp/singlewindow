version: "3.9"

# ─── TradeGateway NGSWTP — Full Middleware Stack ─────────────────────────────
# Services:
#   Kafka + Zookeeper   → Event bus (port 9092)
#   Redis               → Cache + Pub/Sub (port 6379)
#   Keycloak            → IAM / OIDC (port 8080)
#   APISIX + etcd       → API Gateway (port 9080 HTTP, 9443 HTTPS, 9180 admin)
#   Temporal + UI       → Workflow engine (port 7233, UI 8088)
#   Dapr placement      → Service mesh (port 50005)
#   MinIO               → S3-compatible object store (port 9000, console 9001)
#   Fluvio SC           → Real-time streaming (port 9003)
#   Permify             → Fine-grained authz (port 3476)
#   PostgreSQL          → Primary database (port 5432)

networks:
  tradegateway:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  keycloak_data:
  etcd_data:
  temporal_data:
  minio_data:
  fluvio_data:
  permify_data:
  tigerbeetle_data:
  openappsec_data:
  caddy_data:
  caddy_config:

services:

  # ── CADDY (Edge Proxy + TLS + WAF) ──────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: tg-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
      - "2019:2019"     # Admin API (internal only)
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_DOMAIN_BASE: ${CADDY_DOMAIN_BASE:-tradegateway.gov.ng}
      KEYCLOAK_UPSTREAM: keycloak:8080
      APISIX_UPSTREAM: apisix:9080
      FRONTEND_UPSTREAM: frontend:3000
      OAUTH2_PROXY_UPSTREAM: oauth2-proxy:4180
      ACME_EMAIL: ${ACME_EMAIL:-ops@tradegateway.gov.ng}
    depends_on:
      keycloak:
        condition: service_healthy
      apisix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tradegateway

  # ── OAUTH2-PROXY (Keycloak OIDC bridge for Caddy forward_auth) ──────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: tg-oauth2-proxy
    restart: unless-stopped
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_CADDY_CLIENT_SECRET:-changeme-replace-in-production}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-Y2hhbmdlbWUzMmJ5dGVzYmFzZTY0PT0=}
    volumes:
      - ./caddy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    ports:
      - "4180:4180"
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4180/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tradegateway

  # ── POSTGRESQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tg-postgres
    environment:
      POSTGRES_DB: tradegateway
      POSTGRES_USER: tradegateway
      POSTGRES_PASSWORD: tradegateway_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradegateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradegateway

  # ── REDIS ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tg-redis
    command: redis-server --requirepass tradegateway_redis_2026 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tradegateway_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradegateway

  # ── ZOOKEEPER ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tg-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradegateway

  # ── KAFKA ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tg-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tradegateway

  # ── KAFKA TOPIC INIT ───────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tg-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic declaration.submitted --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic declaration.status_changed --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic declaration.cleared --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic payment.initiated --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic payment.confirmed --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic oga.permit_requested --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic oga.permit_reviewed --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic risk.score_computed --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic sanctions.alert --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic security.alert --partitions 3 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic ais.vessel_positions --partitions 6 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic audit.events --partitions 3 --replication-factor 1 &&
        echo 'All Kafka topics created successfully'
      "
    networks:
      - tradegateway

  # ── KEYCLOAK ───────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tg-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/tradegateway
      KC_DB_USERNAME: tradegateway
      KC_DB_PASSWORD: tradegateway_secure_2026
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secure_2026
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tradegateway

  # ── ETCD (for APISIX) ──────────────────────────────────────────────────────
  etcd:
    image: bitnami/etcd:3.5
    container_name: tg-etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradegateway

  # ── APISIX ─────────────────────────────────────────────────────────────────
  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: tg-apisix
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9080:9080"   # HTTP
      - "9443:9443"   # HTTPS
      - "9180:9180"   # Admin API
      - "9091:9091"   # Prometheus metrics
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9080/apisix/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tradegateway

  # ── TEMPORAL ───────────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: tg-temporal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: tradegateway
      POSTGRES_PWD: tradegateway_secure_2026
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal_data:/etc/temporal
    healthcheck:
      test: ["CMD-SHELL", "tctl --address localhost:7233 cluster health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tradegateway

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: tg-temporal-ui
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    networks:
      - tradegateway

  # ── DAPR PLACEMENT ─────────────────────────────────────────────────────────
  dapr-placement:
    image: daprio/dapr:1.13.3
    container_name: tg-dapr-placement
    command: ["./placement", "-port", "50005", "-log-level", "info"]
    ports:
      - "50005:50005"
    networks:
      - tradegateway

  # ── MINIO (S3-compatible object store for Delta Lake) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: tg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tradegateway_minio
      MINIO_ROOT_PASSWORD: minio_secure_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradegateway

  # ── MINIO BUCKET INIT ──────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: tg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 tradegateway_minio minio_secure_2026 &&
        mc mb --ignore-existing myminio/tradegateway-lakehouse &&
        mc mb --ignore-existing myminio/tradegateway-documents &&
        mc mb --ignore-existing myminio/tradegateway-exports &&
        echo 'MinIO buckets initialized'
      "
    networks:
      - tradegateway

  # ── PERMIFY ────────────────────────────────────────────────────────────────
  permify:
    image: ghcr.io/permify/permify:latest
    container_name: tg-permify
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway
      PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: 20
    ports:
      - "3476:3476"
      - "3478:3478"  # gRPC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradegateway

  # ── ANALYTICS SERVICE ──────────────────────────────────────────────────────
  analytics-service:
    build:
      context: ../microservices/analytics-service
      dockerfile: Dockerfile
    container_name: tg-analytics-service
    ports:
      - "8097:8097"
    environment:
      PORT: "8097"
      DELTALAKE_SVC_URL: "${DELTALAKE_SVC_URL:-}"
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8097/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── CARGO TRACKING SERVICE ─────────────────────────────────────────────────
  cargo-tracking-service:
    build:
      context: ../microservices/cargo-tracking-service
      dockerfile: Dockerfile
    container_name: tg-cargo-tracking
    ports:
      - "8087:8087"
    environment:
      PORT: "8087"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PROMETHEUS ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tg-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - tradegateway

  # ── GRAFANA ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: tg-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana_secure_2026
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
    networks:
      - tradegateway

  # ── DECLARATION SERVICE (Go) ───────────────────────────────────────────────
  declaration-service:
    build:
      context: ../microservices/declaration-service
      dockerfile: Dockerfile
    container_name: tg-declaration-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"
      PERMIFY_HOST: "permify:3478"
      TEMPORAL_HOST: "temporal:7233"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PAYMENT SERVICE (Go) ───────────────────────────────────────────────────
  payment-service:
    build:
      context: ../microservices/payment-service
      dockerfile: Dockerfile
    container_name: tg-payment-service
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
      MOJALOOP_URL: "http://mojaloop-switch:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── OGA SERVICE (Go) ───────────────────────────────────────────────────────
  oga-service:
    build:
      context: ../microservices/oga-service
      dockerfile: Dockerfile
    container_name: tg-oga-service
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PROFILE SERVICE (Go) ───────────────────────────────────────────────────
  profile-service:
    build:
      context: ../microservices/profile-service
      dockerfile: Dockerfile
    container_name: tg-profile-service
    ports:
      - "8084:8084"
    environment:
      PORT: "8084"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RISK ENGINE (Go) ──────────────────────────────────────────────────────
  risk-engine:
    build:
      context: ../microservices/risk-engine
      dockerfile: Dockerfile
    container_name: tg-risk-engine
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── SANCTIONS SERVICE (Go) ─────────────────────────────────────────────────
  sanctions-service:
    build:
      context: ../microservices/sanctions-service
      dockerfile: Dockerfile
    container_name: tg-sanctions-service
    ports:
      - "8088:8088"
    environment:
      PORT: "8088"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── TEMPORAL WORKER (Go) ───────────────────────────────────────────────────
  temporal-worker:
    build:
      context: ../microservices/temporal-worker
      dockerfile: Dockerfile
    container_name: tg-temporal-worker
    environment:
      TEMPORAL_HOST: "temporal:7233"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - tradegateway
    restart: unless-stopped

  # ── FLUVIO CONSUMER (Go) ───────────────────────────────────────────────────
  fluvio-consumer:
    build:
      context: ../microservices/fluvio-consumer
      dockerfile: Dockerfile
    container_name: tg-fluvio-consumer
    environment:
      KAFKA_BROKERS: "kafka:9092"
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tradegateway
    restart: unless-stopped

  # ── RISK AI SERVICE (Python/FastAPI) ───────────────────────────────────────
  risk-ai-service:
    build:
      context: ../microservices/risk-ai
      dockerfile: Dockerfile
    container_name: tg-risk-ai
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── GNN RISK SERVICE (Python/FastAPI) ─────────────────────────────────────
  gnn-risk-service:
    build:
      context: ../microservices/gnn-risk
      dockerfile: Dockerfile
    container_name: tg-gnn-risk
    ports:
      - "8091:8080"
    environment:
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── VISION SERVICE (Python/FastAPI) ───────────────────────────────────────
  vision-service:
    build:
      context: ../microservices/vision-service
      dockerfile: Dockerfile
    container_name: tg-vision-service
    ports:
      - "8092:8080"
    environment:
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ANOMALY DETECTION SERVICE (Python/FastAPI) ────────────────────────────
  anomaly-detection-service:
    build:
      context: ../microservices/anomaly-detection
      dockerfile: Dockerfile
    container_name: tg-anomaly-detection
    ports:
      - "8093:8080"
    environment:
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── HS CLASSIFIER SERVICE (Python/FastAPI) ────────────────────────────────
  hs-classifier-service:
    build:
      context: ../microservices/hs-classifier
      dockerfile: Dockerfile
    container_name: tg-hs-classifier
    ports:
      - "8094:8080"
    environment:
      DATABASE_URL: "postgresql://tradegateway:tradegateway_secure_2026@postgres:5432/tradegateway"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── LOKI (Log Aggregation) ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: tg-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tradegateway

  # ── OTEL COLLECTOR ─────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: tg-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/tracing/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - tradegateway

  # ── JAEGER (Distributed Tracing) ───────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: tg-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - tradegateway

  # ── ALERTMANAGER ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tg-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager-config.yaml:/etc/alertmanager/alertmanager.yml
    networks:
      - tradegateway

  # ── TIGERBEETLE (Financial Ledger) ─────────────────────────────────────────
  # TigerBeetle provides linearizable, high-throughput double-entry accounting.
  # Initialise the data file on first run with: docker compose run tigerbeetle-init
  # ── TIGERBEETLE BRIDGE (canonical Go ledger service, HTTP /api/ledger/*) ─────
  # SW-O3: canonical money-rail bridge. Rust bridges are dev-only and removed.
  tigerbeetle-bridge:
    build:
      context: ../services/go/tigerbeetle-bridge
      dockerfile: Dockerfile
    container_name: tg-tigerbeetle-bridge
    restart: unless-stopped
    depends_on:
      tigerbeetle:
        condition: service_started
    environment:
      TB_BRIDGE_HTTP_PORT: "8086"
      TB_BRIDGE_GRPC_PORT: "9086"
      TIGERBEETLE_ADDR: "tigerbeetle:3000"
      TB_ALLOW_SIM_BACKEND: "${TB_ALLOW_SIM_BACKEND:-}"
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "8086:8086"
      - "9086:9086"
    networks:
      - tradegateway
    healthcheck:
      test: ["CMD", "/tigerbeetle-bridge", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.11
    container_name: tg-tigerbeetle
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
        if [ ! -f /var/lib/tigerbeetle/0_0.tigerbeetle ]; then
          /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /var/lib/tigerbeetle/0_0.tigerbeetle;
        fi &&
        exec /tigerbeetle start --addresses=0.0.0.0:3000 /var/lib/tigerbeetle/0_0.tigerbeetle
      "
    volumes:
      - tigerbeetle_data:/var/lib/tigerbeetle
    ports:
      - "3000:3000"
    networks:
      - tradegateway

  # ── OPENAPPSEC AGENT (ML-powered WAF) ──────────────────────────────────────
  # Open AppSec integrates with APISIX to provide real-time WAF protection.
  # Events are published to Kafka topic: waf-events and stored in PostgreSQL.
  openappsec-agent:
    image: openappsec/agent:latest
    container_name: tg-openappsec-agent
    restart: unless-stopped
    environment:
      OPEN_APPSEC_MODE: "prevent"
      OPEN_APPSEC_UPSTREAM: "http://apisix:9080"
      OPEN_APPSEC_LOG_LEVEL: "info"
    volumes:
      - openappsec_data:/etc/cp/conf
    ports:
      - "8119:8119"
    depends_on:
      apisix:
        condition: service_healthy
    networks:
      - tradegateway
