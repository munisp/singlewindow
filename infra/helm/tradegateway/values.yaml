  tigerbeetle-bridge-go:
    enabled: true
    port: 8086
    metricsPort: 9086
    replicas: 2
    daprEnabled: "false"
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits:   { cpu: "2000m", memory: "2Gi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      minAvailable: 1


  fluvio-consumer:
    enabled: true
    port: 8094
    metricsPort: 9090
    replicas: 2
    daprEnabled: "false"
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits:   { cpu: "1000m", memory: "1Gi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
