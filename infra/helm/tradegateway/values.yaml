    pdb:
      minAvailable: 1

  temporal-worker:
    enabled: true
    port: 8090
    metricsPort: 9090
    replicas: 3
    daprEnabled: "false"
    resources:
      requests: { cpu: "500m", memory: "512Mi" }
      limits:   { cpu: "2000m", memory: "2Gi" }
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70
    pdb:
      minAvailable: 2

  analytics-service:
