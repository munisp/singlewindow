    port: 8085
    metricsPort: 9090
    replicas: 2
    daprEnabled: "true"
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits:   { cpu: "1000m", memory: "2Gi" }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      minAvailable: 1

  risk-engine:
    enabled: true
    port: 8087
    metricsPort: 9090
    replicas: 3
    daprEnabled: "true"
    resources:
      requests: { cpu: "1000m", memory: "2Gi" }
      limits:   { cpu: "4000m", memory: "8Gi" }
    hpa:
