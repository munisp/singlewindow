  profile-service:
    enabled: true
    port: 8086
    metricsPort: 9090
    replicas: 2
    daprEnabled: "true"
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits:   { cpu: "1000m", memory: "1Gi" }
