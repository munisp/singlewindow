apiVersion: v2
name: tradegateway
description: >
  TradeGateway™ NGSWTP — Next-Generation Single Window Trade Platform.
  A cloud-native, microservices-based national trade facilitation platform
  covering customs declaration, OGA integration, payment processing,
  risk assessment, and real-time cargo tracking.
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/tradegateway/ngswtp
sources:
  - https://github.com/tradegateway/ngswtp
maintainers:
  - name: TradeGateway Platform Team
    email: platform@tradegateway.gov
keywords:
  - customs
  - trade-facilitation
  - single-window
  - microservices
  - kubernetes
annotations:
  category: "Government / Trade Facilitation"
dependencies:
  - name: postgresql
    version: "15.5.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kafka
    version: "28.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
