# ═══════════════════════════════════════════════════════════════════════════════
# TradeGateway™ NGSWTP — oauth2-proxy Configuration
#
# oauth2-proxy sits between Caddy's forward_auth directive and Keycloak.
# It handles the OIDC authorization code flow and issues session cookies that
# Caddy validates via the /oauth2/auth endpoint.
#
# Documentation: https://oauth2-proxy.github.io/oauth2-proxy/docs/configuration/overview
# ═══════════════════════════════════════════════════════════════════════════════

# ── Provider: Keycloak OIDC ───────────────────────────────────────────────────
provider = "keycloak-oidc"

# Keycloak realm OIDC discovery URL
# In production: https://auth.tradegateway.gov.ng/realms/tradegateway
# In dev: http://keycloak:8080/realms/tradegateway
oidc_issuer_url = "http://keycloak:8080/realms/tradegateway"

# Client registered in Keycloak as "caddy-frontend"
client_id = "caddy-frontend"
# Set via environment variable OAUTH2_PROXY_CLIENT_SECRET
# client_secret = ""

# ── Upstream (where to forward authenticated requests) ───────────────────────
# oauth2-proxy itself does not proxy to the app — Caddy does that.
# Set upstreams to a dummy value; Caddy's forward_auth only uses /oauth2/auth.
upstreams = ["static://200"]

# ── Cookie settings ───────────────────────────────────────────────────────────
# Set via environment variable OAUTH2_PROXY_COOKIE_SECRET (32-byte random base64)
# cookie_secret = ""
cookie_name = "_tradegateway_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
# Cookie valid for 8 hours (matches Keycloak SSO session max lifetime)
cookie_expire = "8h"
cookie_refresh = "1h"
# Shared cookie domain covers all subdomains
cookie_domains = [".tradegateway.gov.ng"]

# ── Session storage ───────────────────────────────────────────────────────────
# Use Redis for session storage so multiple oauth2-proxy replicas share state
session_store_type = "redis"
redis_connection_url = "redis://:tradegateway_redis_2026@redis:6379"

# ── Token passthrough ─────────────────────────────────────────────────────────
# Pass the Keycloak access token to upstream via X-Auth-Request-Access-Token
pass_access_token = true
# Pass user info headers
pass_user_headers = true
set_xauthrequest = true
# Headers set on the upstream request:
#   X-Auth-Request-User    → Keycloak preferred_username
#   X-Auth-Request-Email   → Keycloak email
#   X-Auth-Request-Groups  → Keycloak realm roles (space-separated)
#   X-Auth-Request-Access-Token → raw JWT access token

# ── Scopes ────────────────────────────────────────────────────────────────────
scope = "openid profile email roles"

# ── Allowed email domains ─────────────────────────────────────────────────────
# Restrict to government email domains in production
# email_domains = ["tradegateway.gov.ng", "customs.gov.ng"]
# For development, allow all authenticated users:
email_domains = ["*"]

# ── Redirect URL ─────────────────────────────────────────────────────────────
# Must match the "Valid Redirect URIs" configured in the Keycloak caddy-frontend client
# In production: https://trader.tradegateway.gov.ng/oauth2/callback
redirect_url = "http://localhost:8888/oauth2/callback"

# ── Listener ─────────────────────────────────────────────────────────────────
http_address = "0.0.0.0:4180"

# ── Logging ───────────────────────────────────────────────────────────────────
request_logging = true
auth_logging = true
standard_logging = true
