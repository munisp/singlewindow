# =============================================================================
# TradeGateway™ NGSWTP — Strimzi Kafka Cluster Production Configuration
# =============================================================================
# Deploys a 3-broker Kafka 3.7 cluster with:
#   - SASL/SCRAM-SHA-512 external auth
#   - mTLS internal auth
#   - 500Gi persistent storage per broker (fast-ssd StorageClass)
#   - JVM tuning for 8Gi heap
#   - Prometheus JMX metrics
#   - Schema Registry sidecar
# =============================================================================

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: tradegateway-kafka
  namespace: tradegateway
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
      superUsers:
        - User:admin
        - User:service-account
    config:
      offsets.topic.replication.factor: "3"
      transaction.state.log.replication.factor: "3"
      transaction.state.log.min.isr: "2"
      default.replication.factor: "3"
      min.insync.replicas: "2"
      inter.broker.protocol.version: "3.7"
      log.retention.hours: "168"
      log.segment.bytes: "1073741824"
      log.retention.check.interval.ms: "300000"
      num.partitions: "6"
      auto.create.topics.enable: "false"
      message.max.bytes: "10485760"
      replica.fetch.max.bytes: "10485760"
      # Compression
      compression.type: "lz4"
      # Performance
      num.network.threads: "8"
      num.io.threads: "16"
      socket.send.buffer.bytes: "102400"
      socket.receive.buffer.bytes: "102400"
      socket.request.max.bytes: "104857600"
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 500Gi
          class: fast-ssd
          deleteClaim: false
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
    jvmOptions:
      -Xms: "4096m"
      -Xmx: "8192m"
      gcLoggingEnabled: true
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics-config.yml
    rack:
      topologyKey: topology.kubernetes.io/zone
    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - tradegateway-kafka-kafka
                topologyKey: kubernetes.io/hostname
        tolerations:
          - key: "kafka"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 100Gi
      class: fast-ssd
      deleteClaim: false
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "4Gi"
    jvmOptions:
      -Xms: "1024m"
      -Xmx: "2048m"
    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - tradegateway-kafka-zookeeper
                topologyKey: kubernetes.io/hostname
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
    userOperator:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
---
# ─── Kafka Users ──────────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: tradegateway-producer
  namespace: tradegateway
  labels:
    strimzi.io/cluster: tradegateway-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Write", "Describe", "Create"]
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations: ["Write", "Describe"]
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: tradegateway-consumer
  namespace: tradegateway
  labels:
    strimzi.io/cluster: tradegateway-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: ["Read", "Describe"]
      - resource:
          type: group
          name: "tradegateway-*"
          patternType: prefix
        operations: ["Read", "Describe"]
---
# ─── Schema Registry ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: tradegateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.6.0
          ports:
            - containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "tradegateway-kafka-kafka-bootstrap.tradegateway.svc.cluster.local:9092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "3"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: tradegateway
spec:
  selector:
    app: schema-registry
  ports:
    - port: 8081
      targetPort: 8081
