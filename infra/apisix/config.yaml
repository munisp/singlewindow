apisix:
  node_listen: 9080
  enable_ipv6: false
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180
  admin_key:
    - name: admin
      key: tradegateway-apisix-admin-key-2026
      role: admin
  ssl:
    enable: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 0.0.0.0
      port: 9091
  # OpenAppSec WAF — ext-plugin integration
  # The openappsec-agent sidecar listens on port 8119 and receives pre-request
  # hooks from APISIX via the ext-plugin-pre-req mechanism.
  ext-plugin-pre-req:
    addr: openappsec-agent:8119
    timeout: 2000  # 2s timeout — fail open to avoid blocking legitimate traffic

plugins:
  - real-ip
  - ai
  - client-control
  - proxy-control
  - request-id
  - zipkin
  - ext-plugin-pre-req
  - fault-injection
  - mocking
  - serverless-pre-function
  - cors
  - ip-restriction
  - ua-restriction
  - referer-restriction
  - csrf
  - uri-blocker
  - request-validation
  - openid-connect
  - cas-auth
  - authz-casbin
  - authz-casdoor
  - wolf-rbac
  - ldap-auth
  - hmac-auth
  - basic-auth
  - jwt-auth
  - key-auth
  - consumer-restriction
  - forward-auth
  - opa
  - authz-keycloak
  - proxy-mirror
  - proxy-cache
  - proxy-rewrite
  - api-breaker
  - limit-conn
  - limit-count
  - limit-req
  - gzip
  - server-info
  - traffic-split
  - redirect
  - response-rewrite
  - kafka-logger
  - http-logger
  - tcp-logger
  - udp-logger
  - file-logger
  - clickhouse-logger
  - syslog
  - log-rotate
  - prometheus
  - datadog
  - echo
  - loggly
  - ext-plugin-post-req
  - ext-plugin-post-resp
